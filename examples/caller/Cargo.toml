[package]
name = "caller"
description = "Conformance caller: a wasi:cli/run guest driving one adapter over the source seam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Guest only: the crate is empty on native targets and is built to
# `wasm32-wasip2` by `examples/conformance/build.rs`.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
emery-adapter.workspace = true
serde_json.workspace = true
wasip3.workspace = true

[lints]
workspace = true
