[package]
name = "caller"
description = "Conformance caller: a wasi:cli/run guest driving one adapter over the source seam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The `cdylib` is the guest, built to `wasm32-wasip2` by
# `examples/conformance/build.rs`; natively only the `protocol` module
# compiles, linked by the conformance suite as an `rlib`.
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
emery-source.workspace = true
serde_json.workspace = true
wasip3.workspace = true

[lints]
workspace = true
