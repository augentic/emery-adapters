# Intent example deployment. Relative paths resolve against this file.
#
# Nothing is mounted: the brief rides inline, and the Cursor backend runs the
# agent in a private working tree when no workspace is lent.

# The seam the driver crosses; the runtime dispatches it to the adapter by id.
[link]
interfaces = ["emery:adapter/source@0.1.0"]

# The driver: this example's guest, the command-mode target.
[[guest]]
id = "example"
source.path = "../../target/wasm32-wasip2/release/examples/intent.wasm"
command = true

# The adapter, registered under the id the driver dispatches to.
[[guest]]
id = "intent"
source.path = "../../target/wasm32-wasip2/release/intent.wasm"
