[package]
name = "wasm"
description = "Omnia-hosted wasm deployment example for first-party adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
autolib = false

[[example]]
name = "specify"
path = "specify.rs"
crate-type = ["cdylib"]

[[example]]
name = "wasm"
path = "omnia.rs"

[dependencies]
cfg-if.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
guest.workspace = true

[lints]
workspace = true
