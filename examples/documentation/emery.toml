# Documentation example. Run from the repository root:
#
#   emery specify --config examples/documentation/emery.toml
#
# `adapter` and `path` resolve relative to this file and must land inside the
# invocation directory, which emery mounts as the project.

# The built component, loaded fresh on every run, over the orders service
# specification it reads.
[[source]]
name = "docs"
adapter = "../../target/wasm32-wasip2/release/examples/documentation.wasm"
path = "docs/"
