# Documentation example deployment. Relative paths resolve against this file.

# The seam the driver crosses; the runtime dispatches it to the adapter by id.
[link]
interfaces = ["emery:adapter/source@0.1.0"]

# The driver: this example's guest, the command-mode target.
[[guest]]
id = "example"
source.path = "../../target/wasm32-wasip2/release/examples/documentation.wasm"
command = true

# The adapter, registered under the id the driver dispatches to.
[[guest]]
id = "documentation"
source.path = "../../target/wasm32-wasip2/release/documentation.wasm"

# The tree the driver lends as the workspace.
[[mount]]
name = "."
path = "docs"
