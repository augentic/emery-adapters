# Omnia host + specify workflow guest for the wasm change example.
# Counterpart of running `cargo run -p specify` against the engine's
# `examples/change`, composing this repo's adapter components.
[package]
name = "change"
description = "Omnia host and specify guest for the wasm change example"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "specify"
path = "src/specify.rs"
crate-type = ["cdylib"]

[[bin]]
name = "change"
path = "src/runtime.rs"

[dependencies]
cfg-if.workspace = true

# The specify package is cdylib-only, so the workflow guest is compiled
# here (src/specify.rs + src/provider.rs) against the engine crates.
[target.'cfg(target_arch = "wasm32")'.dependencies]
artifacts = { git = "https://github.com/augentic/specify.git" }
diagnostics = { git = "https://github.com/augentic/specify.git" }
error = { git = "https://github.com/augentic/specify.git" }
jiff = { version = "0.2.32", default-features = false, features = ["serde", "std"] }
omnia-guest.workspace = true
project = { git = "https://github.com/augentic/specify.git" }
serde_json.workspace = true
slice = { git = "https://github.com/augentic/specify.git" }
transport = { git = "https://github.com/augentic/specify.git" }
wasip3 = { version = "0.7.0", features = ["http-compat"] }
wit-bindgen = { version = "0.59.0", features = ["async-spawn"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
