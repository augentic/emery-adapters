[package]
name = "eval"
description = "Native first-party catalog composition: emery passthrough and live eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
autolib = false

# Binary is native-only; wasm32 builds an empty stub so
# `cargo build --workspace --target wasm32-wasip2` stays clean.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
captures.workspace = true
contracts.workspace = true
documentation.workspace = true
intent.workspace = true
native = { workspace = true, features = ["cli"] }
omnia-target.workspace = true
probe = { workspace = true, features = ["client"] }
screenshots.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
typescript.workspace = true
vectis.workspace = true

[lints]
workspace = true
