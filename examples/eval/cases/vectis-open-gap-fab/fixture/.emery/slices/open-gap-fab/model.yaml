# Synthesis model for open-GAP detection. Scenario text for REQ-026
# remains unspecified — v1 audit debt if a B′ close edits only spec.md body.
version: 1
slice: open-gap-fab
requirements:
- id: REQ-021
  title: My Lists View
  status: agreed
  domain: my-lists
  sources:
  - intent
  claims: []
  statement: >-
    The My Lists screen presents a scrollable body listing task lists and a
    floating action button overlay.
  scenarios:
  - >-
    WHEN the user views the My Lists screen THEN the layout includes a list
    body and a floating action button region
- id: REQ-022
  title: List row display
  status: agreed
  domain: my-lists
  sources:
  - intent
  claims: []
  statement: Each list row displays the list name and an item count.
  scenarios:
  - >-
    WHEN a list row is rendered on My Lists THEN the row shows the list name
    and item count
- id: REQ-024
  title: Create list floating action button
  status: agreed
  domain: my-lists
  sources:
  - intent
  claims: []
  statement: >-
    My Lists exposes a floating action button as the primary creation action
    for new lists.
  scenarios:
  - >-
    WHEN the user views My Lists THEN a floating action button is visible for
    primary list creation
- id: REQ-026
  title: FAB activation behaviour
  status: agreed
  domain: my-lists
  sources:
  - intent
  claims: []
  statement: >-
    A floating action button is present on My Lists; the action triggered when
    the user activates it is not evidenced.
  scenarios:
  - >-
    WHEN the user activates the My Lists floating action button THEN the
    resulting navigation or state change is unspecified — operator must supply
    acceptance criteria
