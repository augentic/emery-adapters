# Symbol-heavy inventory for the open-GAP FAB fixture. Platform symbols
# need no canonical masters; the guest prepare prelude may skip exports.

version: 1

provenance:
  sources:
    - kind: manual
      captured_at: "2026-08-03T00:00:00Z"

app-icon: launcher

assets:
  add:
    kind: symbol
    role: icon
    symbols:
      ios: plus
      android: add
  launcher:
    kind: vector
    role: app-icon
    alt: "Open GAP FAB"
    source: assets/app-icon.svg
