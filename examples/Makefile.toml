# -------------------------------------
# The eval example (native + live-model)
# -------------------------------------

[env]
CURSOR_MODEL = "claude-opus-5-high"
CURSOR_TIMEOUT_SECS = 1200
CURSOR_INACTIVITY_SECS = 600
VECTIS_EXEMPLAR_DIR = "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/../vectis-exemplar"

# The one lab entry, shaped like the emery CLI plus the case runner:
# bare `cargo make eval` lists the cases, `cargo make eval <id>` runs
# one (an existing sandbox resumes; `--restart` reruns from fresh
# state), any emery verb passes through (`cargo make eval <id> plan
# status` binds the case's retained sandbox). The probe client owns
# the log presets (flagless invocations default to `info`, `--debug`
# adds the backend dumps); cargo-make needs `--` only when the first
# token is a cargo-make flag.
[tasks.eval]
env_files = [".env"]
command = "cargo"
args = ["run", "-p", "eval", "--", "${@}"]

# -------------------------------------
# Wasm examples
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm-contracts sandbox/wasm-omnia-r9k"

[tasks.wasm-build]
script = '''
  cargo build -p emery --lib --target wasm32-wasip2 --manifest-path ../emery/Cargo.toml
  cargo build -p emery --bin emery --manifest-path ../emery/Cargo.toml
  cargo build -p documentation -p intent -p contracts -p typescript --target wasm32-wasip2
  cargo build --manifest-path targets/omnia/Cargo.toml --target wasm32-wasip2
'''

[tasks.wasm-contracts]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
  set -euo pipefail
  export EMERY_HOME="$PWD/sandbox/wasm-contracts"

  CHANGE="$EMERY_HOME/change"
  PRODUCT="$EMERY_HOME/product"
  DEFINITION="$PWD/examples/eval/cases/orders-contracts/definition"

  rm -rf "$EMERY_HOME"
  mkdir -p "$CHANGE" "$PRODUCT"
  cp -R examples/wasm/fixture/. "$CHANGE/"
  # Coverage locators (`definition/intent.txt`, `docs`) join the change home.
  cp -R "$DEFINITION" "$CHANGE/definition"
  # cursor-agent anchors the workspace (and .cursor/mcp.json discovery) at the git toplevel.
  git init -q "$CHANGE"
  git init -q "$PRODUCT"

  EMERY_BIN="$PWD/../emery/target/debug/emery"
  # `--debug` keeps the seam visibility the env-driven filter used to give.
  emery() { (cd "$CHANGE" && "$EMERY_BIN" --debug "$@"); }
  emery_product() { (cd "$PRODUCT" && "$EMERY_BIN" --debug "$@"); }

  ADAPTER_DIR="$PWD/target/wasm32-wasip2/debug"
  emery adapter add "$ADAPTER_DIR/documentation.wasm"
  emery adapter add "$ADAPTER_DIR/intent.wasm"
  emery adapter add "$ADAPTER_DIR/contracts.wasm"

  emery_product init contracts --name orders

  emery plan author orders --from "$CHANGE/definition" --wave deliver
  emery plan refine
  emery plan execute
'''

[tasks.wasm-omnia-r9k]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
  set -euo pipefail
  export EMERY_HOME="$PWD/sandbox/wasm-omnia-r9k"

  CACHE="$PWD/examples/eval/cases/omnia-r9k/fixture"
  DEST="$CACHE/legacy/at_r9k_position_adapter"
  URL="https://bitbucket.org/Propellerhead/at_r9k_position_adapter.git"
  if [ ! -d "$DEST" ]; then
    mkdir -p "$(dirname "$DEST")"
    git clone --depth 1 "$URL" "$DEST"
    rm -rf "$DEST/.git"
  fi

  CHANGE="$EMERY_HOME/change"
  PRODUCT="$EMERY_HOME/product"
  DEFINITION="$PWD/examples/eval/cases/omnia-r9k/definition"

  rm -rf "$EMERY_HOME"
  mkdir -p "$CHANGE" "$PRODUCT"
  cp -R "$CACHE"/. "$CHANGE/"
  # Coverage locators (`definition/intent.txt`, `legacy/…`) join the change home.
  cp -R "$DEFINITION" "$CHANGE/definition"
  git init -q "$CHANGE"
  git init -q "$PRODUCT"

  EMERY_BIN="$PWD/../emery/target/debug/emery"
  emery() { (cd "$CHANGE" && "$EMERY_BIN" --debug "$@"); }
  emery_product() { (cd "$PRODUCT" && "$EMERY_BIN" --debug "$@"); }

  ADAPTER_DIR="$PWD/target/wasm32-wasip2/debug"
  emery adapter add "$ADAPTER_DIR/typescript.wasm"
  emery adapter add "$ADAPTER_DIR/intent.wasm"
  emery adapter add "$ADAPTER_DIR/omnia.wasm"

  emery_product init omnia --name at-r9k-position-adapter

  emery plan author at-r9k-position-adapter --from "$CHANGE/definition" --wave deliver
  emery plan refine
  emery plan execute
'''
