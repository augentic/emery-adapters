# -------------------------------------
# The eval example (native + live-model)
# -------------------------------------

[env]
# CURSOR_MODEL = "opus"
# CURSOR_TIMEOUT_SECS = "1800"
# RUST_LOG = "info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia::telemetry=off,omnia_cursor=debug"
RUST_LOG='info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia_cursor=debug,omnia_wasi_http=debug'

# Resolve the workspace-sibling vectis-exemplar to an absolute path.
# From sandbox/<case>/ the default `../vectis-exemplar` would otherwise
# land on sandbox/vectis-exemplar; export before the eval binary runs.
[tasks.eval]
env_files = [".env"]
script_runner = "bash"
script = '''
set -euo pipefail
if [ -z "${VECTIS_EXEMPLAR_DIR:-}" ]; then
  sibling="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY:-.}/../vectis-exemplar"
  if [ -d "$sibling" ]; then
    export VECTIS_EXEMPLAR_DIR="$(cd "$sibling" && pwd)"
  fi
fi
cargo run -p eval -- eval "$@"
'''

[tasks.lab]
env_files = [".env"]
script_runner = "bash"
script = '''
set -euo pipefail
if [ -z "${VECTIS_EXEMPLAR_DIR:-}" ]; then
  sibling="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY:-.}/../vectis-exemplar"
  if [ -d "$sibling" ]; then
    export VECTIS_EXEMPLAR_DIR="$(cd "$sibling" && pwd)"
  fi
fi
cargo run -p eval -- "$@"
'''

# -------------------------------------
# Wasm example
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

[tasks.wasm-build]
dependencies = ["wasm-clean"]
script = '''
  cargo build -p emery --lib --target wasm32-wasip2 --manifest-path ../emery/Cargo.toml
  cargo build -p emery --bin emery --manifest-path ../emery/Cargo.toml
  cargo build -p documentation -p intent -p contracts --target wasm32-wasip2
'''

[tasks.wasm-run]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
  set -eo pipefail

  export EMERY_HOME="$PWD/sandbox/wasm"
  export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"
  export RUST_LOG="${RUST_LOG:-info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia::telemetry=off}"

  mkdir -p "$EMERY_HOME/project"
  cp -R examples/wasm/fixture/. "$EMERY_HOME/project/"

  EMERY="$PWD/../emery/target/debug/emery"
  TARGET="$PWD/target"
  # Execute commands in the project directory, not the repository root.
  run() { (cd "$EMERY_HOME/project" && "$EMERY" "$@"); }

  run adapter add "$TARGET/wasm32-wasip2/debug/documentation.wasm"
  run adapter add "$TARGET/wasm32-wasip2/debug/intent.wasm"
  run adapter add "$TARGET/wasm32-wasip2/debug/contracts.wasm"
  run init contracts --name orders

  run plan author orders \
    --intent "Author the API contracts for the orders service described under docs/: the JSON Schema vocabulary plus the HTTP (OpenAPI) surface. Contracts only - no service implementation." \
    --source "docs=documentation:docs"
  run plan approve
  run plan execute
'''
