# -------------------------------------
# The eval example (native + live-model)
# -------------------------------------

[env]
# CURSOR_MODEL = "opus"
# CURSOR_TIMEOUT_SECS = "1800"
# RUST_LOG = "info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia::telemetry=off,omnia_cursor=debug"
RUST_LOG='info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia_cursor=debug,omnia_wasi_http=debug'

# Resolve the workspace-sibling vectis-exemplar to an absolute path.
# From sandbox/<case>/ the default `../vectis-exemplar` would otherwise
# land on sandbox/vectis-exemplar; export before the eval binary runs.
[tasks.eval]
env_files = [".env"]
script_runner = "bash"
script = '''
set -euo pipefail
if [ -z "${VECTIS_EXEMPLAR_DIR:-}" ]; then
  sibling="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY:-.}/../vectis-exemplar"
  if [ -d "$sibling" ]; then
    export VECTIS_EXEMPLAR_DIR="$(cd "$sibling" && pwd)"
  fi
fi
cargo run -p eval -- eval "$@"
'''

[tasks.lab]
env_files = [".env"]
script_runner = "bash"
script = '''
set -euo pipefail
if [ -z "${VECTIS_EXEMPLAR_DIR:-}" ]; then
  sibling="${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY:-.}/../vectis-exemplar"
  if [ -d "$sibling" ]; then
    export VECTIS_EXEMPLAR_DIR="$(cd "$sibling" && pwd)"
  fi
fi
cargo run -p eval -- "$@"
'''

# -------------------------------------
# Wasm examples (component seam)
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm-contracts sandbox/wasm-omnia-r9k"

[tasks.wasm-build]
script = '''
  cargo build -p emery --lib --target wasm32-wasip2 --manifest-path ../emery/Cargo.toml
  cargo build -p emery --bin emery --manifest-path ../emery/Cargo.toml
  cargo build -p documentation -p intent -p contracts -p typescript -p omnia --target wasm32-wasip2
'''

[tasks.wasm-contracts]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
  set -euo pipefail

  export EMERY_HOME="$PWD/sandbox/wasm-contracts"
  export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"
  export RUST_LOG="${RUST_LOG:-info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia::telemetry=off}"

  rm -rf "$EMERY_HOME"
  mkdir -p "$EMERY_HOME/project"
  cp -R examples/wasm/fixture/. "$EMERY_HOME/project/"

  EMERY="$PWD/../emery/target/debug/emery"
  TARGET="$PWD/target"
  # Execute commands in the project directory, not the repository root.
  run() { (cd "$EMERY_HOME/project" && "$EMERY" "$@"); }

  run adapter add "$TARGET/wasm32-wasip2/debug/documentation.wasm"
  run adapter add "$TARGET/wasm32-wasip2/debug/intent.wasm"
  run adapter add "$TARGET/wasm32-wasip2/debug/contracts.wasm"
  run init contracts --name orders

  run plan author orders \
    --intent "Author the API contracts for the orders service described under docs/: the JSON Schema vocabulary plus the HTTP (OpenAPI) surface. Contracts only - no service implementation." \
    --source "docs=documentation:docs"
  run plan approve
  run plan execute
'''

[tasks.wasm-omnia-r9k]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
  set -euo pipefail

  export EMERY_HOME="$PWD/sandbox/wasm-omnia-r9k"
  export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"
  export RUST_LOG="${RUST_LOG:-info,opentelemetry=off,opentelemetry_sdk=off,omnia_wasi_otel=off,omnia::telemetry=off}"

  # Share the eval case's gitignored fixture cache (UNLICENSED upstream).
  # Same clone-on-miss semantics as probe::case::clone_into.
  CACHE="$PWD/examples/eval/cases/omnia-r9k/fixture"
  DEST="$CACHE/legacy/at_r9k_position_adapter"
  URL="https://bitbucket.org/Propellerhead/at_r9k_position_adapter.git"
  if [ ! -d "$DEST" ]; then
    mkdir -p "$(dirname "$DEST")"
    git clone --depth 1 "$URL" "$DEST"
    rm -rf "$DEST/.git"
  fi

  rm -rf "$EMERY_HOME"
  mkdir -p "$EMERY_HOME/project"
  cp -R "$CACHE"/. "$EMERY_HOME/project/"

  EMERY="$PWD/../emery/target/debug/emery"
  TARGET="$PWD/target"
  run() { (cd "$EMERY_HOME/project" && "$EMERY" "$@"); }

  run adapter add "$TARGET/wasm32-wasip2/debug/typescript.wasm"
  run adapter add "$TARGET/wasm32-wasip2/debug/intent.wasm"
  run adapter add "$TARGET/wasm32-wasip2/debug/omnia.wasm"
  run init omnia --name at-r9k-position-adapter

  run plan author at-r9k-position-adapter \
    --intent "Migrate the legacy TypeScript at_r9k_position_adapter (https://bitbucket.org/Propellerhead/at_r9k_position_adapter) under legacy/ into a new Omnia WASM crate with provider-based dependency injection. Survey and extract behaviour from the TypeScript tree; build the guest, crate, and tests; merge specs into the baseline." \
    --source "legacy=typescript:legacy/at_r9k_position_adapter"
  run plan approve
  run plan execute
'''
