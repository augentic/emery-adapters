# -------------------------------------
# The eval example (native dev shim + live-model eval)
# -------------------------------------

# The CLI passthrough: any specify verb against the native
# shim (`cargo make specify -- --project-dir <dir> slice list`).
[tasks.specify]
command = "cargo"
args = ["run", "-q", "-p", "eval", "--", "${@}"]

# One live eval case (`cargo make eval orders-contracts --restart
# [--until plan]`); bare `cargo make eval` lists the cases. Case data
# lives in `eval/cases/<id>/case.toml`; the retained sandbox in
# `eval/sandbox/<id>/`. The omnia-r9k case needs its gitignored fixture
# staged first: `cargo make eval-omnia-r9k-prepare`.
[tasks.eval]
env_files = [".env"]
script = '''
  export EVAL_TIMEOUT_SECS="${EVAL_TIMEOUT_SECS:-900}"
  export RUST_LOG="${RUST_LOG:-info,opentelemetry_sdk=off}"
  cargo run -p eval -- eval "$@"
  '''

# Stage the Propellerhead at_r9k_position_adapter tree into the
# gitignored omnia-r9k fixture. Explicit and separate from case
# execution: it mutates a gitignored fixture and accesses the network.
# Manual / offline staging: examples/eval/fixtures/omnia-r9k/README.md.
[tasks.eval-omnia-r9k-prepare]
script_runner = "bash"
script = '''
set -euo pipefail
DEST=examples/eval/fixtures/omnia-r9k/project/legacy/at_r9k_position_adapter
[ -d "$DEST/src" ] && { echo "omnia-r9k fixture ready: $DEST"; exit 0; }
rm -rf "$DEST"
git clone --depth 1 "${OMNIA_R9K_GIT_URL:-https://bitbucket.org/Propellerhead/at_r9k_position_adapter.git}" "$DEST" \
  || { echo "error: clone failed; stage manually per examples/eval/fixtures/omnia-r9k/README.md" >&2; exit 1; }
rm -rf "$DEST/.git" "$DEST/node_modules" "$DEST"/.github/env.*
echo "omnia-r9k fixture ready: $DEST"
'''

# -------------------------------------
# Wasm example
# -------------------------------------

[tasks.wasm-clean]
script = "rm -rf sandbox/wasm"

[tasks.wasm-build]
dependencies = ["wasm-clean"]
script = '''
# Shipped specify binary (embedded engine guest) from the sibling checkout.
cargo build -p specify --lib --target wasm32-wasip2 --manifest-path ../specify/Cargo.toml
cargo build -p specify --bin specify --manifest-path ../specify/Cargo.toml

cargo build -p documentation -p intent -p contracts --target wasm32-wasip2
'''

[tasks.wasm-run]
dependencies = ["wasm-build"]
env_files = [".env"]
script_runner = "bash"
script = '''
set -eo pipefail

export SPECIFY_HOME="$PWD/sandbox/wasm"
export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"
export RUST_LOG="${RUST_LOG:-info,opentelemetry_sdk=off}"

mkdir -p "$SPECIFY_HOME/project"
cp -R examples/wasm/fixture/. "$SPECIFY_HOME/project/"

SPECIFY="$PWD/../specify/target/debug/specify"
TARGET="$PWD/target"
# Execute commands in the project directory, not the repository root.
run() { (cd "$SPECIFY_HOME/project" && "$SPECIFY" "$@"); }

run adapter add "$TARGET/wasm32-wasip2/debug/documentation.wasm"
run adapter add "$TARGET/wasm32-wasip2/debug/intent.wasm"
run adapter add "$TARGET/wasm32-wasip2/debug/contracts.wasm"
run init contracts --name orders

run plan author orders \
  --intent "Author the API contracts for the orders service described under docs/: the JSON Schema vocabulary plus the HTTP (OpenAPI) surface. Contracts only - no service implementation." \
  --source "docs=documentation:docs"
run plan approve
run plan execute
'''
