# Install: https://mise.jdx.dev
# Run: `mise run <task>` (the root Makefile forwards `make <task>` here)

[task_config]
includes = ["git::https://github.com/augentic/.github.git//mise/rust.toml?ref=v0.2.0"]

# The shared `lint-wasm` pass is over the guest side alone — every adapter
# and the guest programs — because the root package is native: its suites,
# and the eval harness under `examples/eval/`, name host-only dependencies.
# Mirrors `wasm-packages` in .github/workflows/ci.yaml; a new adapter is
# named in both.
[env]
WASM32_PACKAGES = "documentation intent typescript test-programs"

# -------------------------------------
# Adapter overrides
# -------------------------------------

# Shadows the shared `publish` (a crates.io dry run): nothing in this workspace
# publishes to crates.io, and the train ships as Wasm OCI packages instead —
# the same `wkg oci push` `.github/workflows/adapters.yaml` runs per component.
[tasks.publish]
description = "Push one release-built component to its GHCR tag: mise run publish <name>"
run = '''
name="${1:?usage: make publish <name>}"
version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
wkg oci push "ghcr.io/augentic/emery-adapters/$name:$version" "target/wasm32-wasip2/release/$name.wasm"
'''
