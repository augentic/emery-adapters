# Install: first `make <task>` installs mise if missing (https://mise.run)
# Run: `mise run <task>` (the root Makefile forwards `make <task>` here)

# Satellite tools stay operator-installed until [tools] is version-pinned.
# rustc stays on rust-toolchain.toml.

[task_config]
includes = ["mise-rust.toml"]
# includes = ["git::https://github.com/augentic/.github.git//mise/rust.toml?ref=v0.1.0"]

# -------------------------------------
# Adapter overrides
# -------------------------------------

# The guest side — every adapter's `survey` and `guest` modules, and every
# program under `crates/test-programs/programs/` — is `cfg(target_arch =
# "wasm32")`, which native clippy compiles to nothing: lint it for its own
# target too, where `clippy.toml`'s guest deny-list applies. The root package
# is native tests alone and is left out of that pass.
[tasks.lint]
run = [
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo clippy --workspace --exclude emery-adapters --lib --examples --target wasm32-wasip2 -- -D warnings",
]

[tasks.publish]
run = '''
name="${1:?usage: make publish <name>}"
version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
wkg oci push "ghcr.io/augentic/emery-adapters/$name:$version" "target/wasm32-wasip2/release/$name.wasm"
'''
