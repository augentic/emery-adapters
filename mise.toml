[tasks.release]
run = "cargo build --workspace --target wasm32-wasip2 --release"

[tasks.publish]
run = '''
name="${1:?usage: make publish <name>}"
version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
wkg oci push "ghcr.io/augentic/emery-adapters/$name:$version" "target/wasm32-wasip2/release/$name.wasm"
'''
