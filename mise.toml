# Install: first `make <task>` installs mise if missing (https://mise.run)
# Run: `mise run <task>` (the root Makefile forwards `make <task>` here)

# Satellite tools stay operator-installed until [tools] is version-pinned.
# rustc stays on rust-toolchain.toml.

[task_config]
includes = ["mise-rust.toml"]
# includes = ["git::https://github.com/augentic/.github.git//mise/rust.toml?ref=v0.1.0"]

