# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
# The published `specify:core` component the wasm change example runs.
# The native eval workspace tracks the sibling `../specify` checkout
# instead (the committed path patch in eval/Cargo.toml).
SPECIFY_CORE_VERSION = "0.27.2"

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint
[tasks.lint]
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Test
#
# `clean` is not necessary as the `RUSTFLAGS=-Dwarnings` override differs
# from the default profile, so cargo rebuilds the workspace.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

[tasks.release]
command = "cargo"
args = [
  "build",
  "--workspace",
  "--exclude",
  "composed",
  "--exclude",
  "change-example",
  "--target",
  "wasm32-wasip2",
  "--release",
]

# -------------------------------------
# The eval workspace (native dev shim + live-model harness)
# -------------------------------------
# `eval/` is a standalone workspace excluded from the root: it consumes
# Specify's engine crates — including the shared `harness` runtime and
# its wrapper-binary entry — from the sibling `../specify` checkout via
# the committed path patch in eval/Cargo.toml, so it stays out of `ci`
# and runs through these focused tasks instead. One member: `engine`,
# the wrapper binary linking the first-party adapters over the shared
# harness.

[tasks.eval-test]
command = "cargo"
args = [
  "nextest",
  "run",
  "--manifest-path",
  "eval/Cargo.toml",
  "--workspace",
  "--all-features",
  "--no-tests=pass",
]
env = { RUSTFLAGS = "-Dwarnings" }

[tasks.eval-lint]
command = "cargo"
args = [
  "clippy",
  "--manifest-path",
  "eval/Cargo.toml",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# The `engine` CLI passthrough: any specify verb against the native
# shim (`cargo make dev -- --project-dir <dir> slice list`).
[tasks.dev]
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "eval/Cargo.toml",
  "--",
  "${@}",
]

# The native live-model trial (`engine eval`): the operator rhythm
# over a persistent `sandbox/` project with the linked adapters,
# graded by deterministic validators only. Live-only — needs an
# authenticated cursor-agent on PATH; never part of `ci`. A full pass
# cleans the sandbox; a failing phase retains it for in-place review
# and per-phase re-runs (`cargo make eval execute`). Single-operation
# prompt scenarios ride the same entry (`cargo make eval scenario
# contracts/design`; bare `scenario` lists them).
[tasks.eval]
command = "cargo"
args = [
  "run",
  "-q",
  "--manifest-path",
  "eval/Cargo.toml",
  "--",
  "eval",
  "${@}",
]
env_files = [".env"]

# -------------------------------------
# The wasm change example
# -------------------------------------
# The end-to-end example over the real WIT seam: the published
# `specify:core` guest composed with this repo's built adapter
# components in one Omnia deployment, driven through the operator
# rhythm by the `change-example` host binary. Operator-invoked demo
# posture — exit codes plus a final artifact-exists check, not a
# graded test.

# Fetch the pinned core component into the gitignored cache. Uses the
# same wkg vendoring pattern as wit/ (see wit/README.md); the registry
# requires authenticated wkg credentials.
[tasks.core-fetch]
script = '''
set -euo pipefail
mkdir -p target/core
wkg get "specify:core@${SPECIFY_CORE_VERSION}" \
  --config wit/config.toml \
  --output target/core/specify.wasm || {
  echo "wkg get specify:core@${SPECIFY_CORE_VERSION} failed." >&2
  echo "If this is an authentication failure: the specify: namespace routes" >&2
  echo "through augentic.io to a private OCI registry — log in with your OCI" >&2
  echo "credentials (e.g. \`docker login\`), then re-run \`cargo make core-fetch\`." >&2
  echo "See wit/README.md." >&2
  exit 1
}
echo "fetched specify:core@${SPECIFY_CORE_VERSION} -> target/core/specify.wasm"
'''

[tasks.change-clean]
script = '''
rm -rf sandbox/change
'''

# Build only the components the change example composes (the two bound
# sources plus the contracts target) — the full `adapter` build of
# every component is not needed here.
[tasks.change-components]
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/components.rs",
  "build-fast",
  "documentation",
  "intent",
  "contracts",
]

[tasks.change-run]
dependencies = ["change-clean", "change-components"]
env_files = [".env"]
script = '''
set -euo pipefail

test -f target/core/specify.wasm || {
  echo "missing target/core/specify.wasm; run \`cargo make core-fetch\` first" >&2
  exit 1
}

mkdir -p sandbox/change/{workspace,cache,store}
cp -R examples/change/seed/. sandbox/change/workspace/
cp target/wasm32-wasip2/release/contracts.wasm sandbox/change/workspace/contracts.wasm

# Pre-build the host binaries so the `cargo run -q` calls below never
# interleave build output with the run.
cargo build -q -p change-example

# The HTTP trigger serves every adapter's /mcp/<name> reference route;
# the env grants point the adapters' spawned agents at it. The port is
# picked per run so parallel runs never fight over one hard-coded
# address (override with HTTP_ADDR=host:port).
export HTTP_ADDR="${HTTP_ADDR:-$(cargo run -q -p change-example --bin change-support -- port)}"
export SPECIFY_DOCUMENTATION_MCP_URL="http://$HTTP_ADDR/mcp/documentation"
export SPECIFY_INTENT_MCP_URL="http://$HTTP_ADDR/mcp/intent"
export SPECIFY_CONTRACTS_MCP_URL="http://$HTTP_ADDR/mcp/contracts"

# Each verb is one `wasi:cli/run` invocation; live judgment legs run for
# minutes, so lift omnia's 30s default wall-clock cap.
export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"

run() {
  cargo run -q -p change-example -- run --config examples/change/omnia.toml -- "$@"
}

# The operator rhythm, over the shared trial inputs (the same file the
# native trial parses — see `harness::inputs` in specify/crates/harness).
. examples/change/trial.env
run init ./contracts.wasm --name "$TRIAL_PROJECT_NAME"
run plan author "$TRIAL_CHANGE" \
  --intent "$TRIAL_INTENT" \
  --source "$TRIAL_SOURCE"
run plan transition "$TRIAL_CHANGE" approved
run plan execute

# The completion gate: capture the drained projection, then verify the
# plan is drained, every entry is done, and the merged contracts
# baseline is non-empty and clean under the contracts validator.
run plan status --format json > sandbox/change/status.json
cargo run -q -p change-example --bin change-support -- \
  verify sandbox/change/workspace sandbox/change/status.json
'''

# Fast dev-loop builds of the adapter components: same `--release`
# artifact path the engine's bare-name resolution probes
# (`target/wasm32-wasip2/release/<name>.wasm`), but with LTO off and a
# low opt level so the edit-resolve loop pays seconds, not a full
# release build. Optional package arg scopes the build
# (`cargo make adapter contracts`); default is every adapter.
# Accepted trade: switching between `adapter` and `release` changes
# the profile fingerprint and forces a rebuild — publishing is rare.
[tasks.adapter]
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/components.rs",
  "build-fast",
  "${@}",
]

# Publish every release-built adapter component under its package version.
[tasks.publish]
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/components.rs",
  "publish",
]
