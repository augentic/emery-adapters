# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Cross-repo developer loop. The sibling specify checkout owns command
# dispatch; pass its subcommand and arguments after `--`.
[tasks.dev]
cwd = "${CARGO_MAKE_WORKING_DIRECTORY}/../specify"
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/dev.rs",
  "${@}",
]

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint
[tasks.lint]
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Test
#
# `clean` is not necessary as the `RUSTFLAGS=-Dwarnings` override differs
# from the default profile, so cargo rebuilds the workspace.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

[tasks.release]
command = "cargo"
args = [
  "build",
  "--workspace",
  "--exclude",
  "adapter-host-tests",
  "--target",
  "wasm32-wasip2",
  "--release",
]

# Fast dev-loop builds of the adapter components: same `--release`
# artifact path the engine's bare-name resolution probes
# (`target/wasm32-wasip2/release/<name>.wasm`), but with LTO off and a
# low opt level so the edit-resolve loop pays seconds, not a full
# release build. Optional package arg scopes the build
# (`cargo make adapter contracts`); default is every adapter.
# Accepted trade: switching between `adapter` and `release` changes
# the profile fingerprint and forces a rebuild — publishing is rare.
[tasks.adapter]
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/components.rs",
  "build-fast",
  "${@}",
]

# Publish every release-built adapter component under its package version.
[tasks.publish]
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/components.rs",
  "publish",
]
