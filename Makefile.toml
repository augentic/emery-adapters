# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint
[tasks.lint]
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Test
#
# `clean` is not necessary as the `RUSTFLAGS=-Dwarnings` override differs
# from the default profile, so cargo rebuilds the workspace.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

[tasks.release]
command = "cargo"
args = [
  "build",
  "--workspace",
  "--exclude",
  "composed",
  "--exclude",
  "change",
  "--exclude",
  "lab",
  "--target",
  "wasm32-wasip2",
  "--release",
]

# -------------------------------------
# The lab crate (native dev shim + live-model eval)
# -------------------------------------
# `crates/lab/` is the unpublished composition binary linking the
# first-party adapters over Specify's `linked` host and lab-only `eval`
# library, consumed from the sibling `../specify` checkout via the
# committed path patch in Cargo.toml. The binary is native-only (`ci`
# builds and lints it; the wasm32 component tasks exclude it); the
# live model rungs below stay operator-invoked.

# The lab CLI passthrough: any specify verb against the native
# shim (`cargo make specify -- --project-dir <dir> slice list`).
[tasks.specify]
command = "cargo"
args = ["run", "-q", "-p", "lab", "--", "${@}"]

# The native live-model trial (the lab binary's `eval` subcommand)
[tasks.eval]
env_files = [".env"]
script = '''
  cargo run -p lab -- eval \
    --fixture examples/change/fixture \
    --change "orders" \
    --intent "Author the API contracts for the orders service described under docs/: the JSON Schema vocabulary plus the HTTP (OpenAPI) surface. Contracts only - no service implementation." \
    --source "docs=documentation:docs" \
    --target "contracts" \
    "$@"
  '''

# -------------------------------------
# Change example
# -------------------------------------
[tasks.change-clean]
script = "rm -rf sandbox/change"

[tasks.change-build]
script = '''
cargo build --example specify --target wasm32-wasip2
cargo build -p documentation --target wasm32-wasip2
cargo build -p intent --target wasm32-wasip2
cargo build -p contracts --target wasm32-wasip2
'''

[tasks.change-run]
dependencies = ["change-clean", "change-build"]
env_files = [".env"]
script = '''
export RUST_LOG="info,opentelemetry_sdk=off,omnia_wasi_http=debug"

mkdir -p sandbox/change/{workspace,cache,store}
cp -R examples/change/fixture/. sandbox/change/workspace/
cp target/wasm32-wasip2/debug/contracts.wasm sandbox/change/workspace/contracts.wasm

run() {
  cargo run --example change -- run --config examples/change/omnia.toml -- "$@"
}

. examples/change/trial.env
run init ./contracts.wasm --name "$TRIAL_PROJECT_NAME"
run plan author "$TRIAL_CHANGE" --intent "$TRIAL_INTENT" --source "$TRIAL_SOURCE"
run plan transition "$TRIAL_CHANGE" approved
run plan execute
'''

