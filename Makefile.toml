# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt
[tasks.fmt]
script = "cargo +nightly fmt --all"

[tasks.lint]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
install_crate = { rustup_component_name = "clippy" }

[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

[tasks.cov]
workspace = false
script = "cargo llvm-cov nextest -p ${CRATE} --summary-only"
install_crate = "cargo-llvm-cov"

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet — read-only gate: verification must never rewrite the audit
# inputs it verifies. Regeneration is the explicit maintenance act.
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

# Fast development build of one adapter component.
[tasks.adapter]
workspace = false
script_runner = "bash"
script = '''
name="${1:?usage: cargo make adapter <name>}"
cargo build -p "$name" --target wasm32-wasip2 --release
'''

# Live eval (operator-invoked, never CI): the public-contract runner
# over the sibling shipped `emery` binary and the built components.
# See examples/eval/README.md.
[tasks.eval]
workspace = false
script_runner = "bash"
script = '''
cargo run -p eval --release -- "$@"
'''

# Components only: the eval runner is a native public-contract client.
[tasks.release]
command = "cargo"
args = [
  "build",
  "--workspace",
  "--exclude",
  "eval",
  "--target",
  "wasm32-wasip2",
  "--release",
]

# Publish — push one built component to its exact GHCR SemVer tag as a
# standard Wasm OCI artifact. Used by Publish Release (adapters.yaml) and
# as a local breakout: log in first (`gh auth token | docker login ghcr.io
# -u <github-user> --password-stdin`).
[tasks.publish]
script_runner = "bash"
install_crate = { crate_name = "wkg", binary = "wkg", test_arg = "--version" }
script = '''
name="${1:?usage: cargo make publish <name>}"
version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"

wkg oci push "ghcr.io/augentic/emery-adapters/$name:$version" "target/wasm32-wasip2/release/$name.wasm"
'''
