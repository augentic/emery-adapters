# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt-check", "lint", "test", "test-docs", "doc", "check-hook-scripts", "check-guardrails-consumer-boundary", "check-pins"]

[tasks.ci]
dependencies = ["fmt-check", "lint", "test", "test-docs", "doc", "vet", "deny", "check-hook-scripts", "check-guardrails-consumer-boundary", "check-pins"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Native hook scripts (POSIX `sh` contract — same runner as specify slice build)
[tasks.check-hook-scripts]
script = '''
sh targets/vectis/scripts/test-hook-scripts.sh
'''

[tasks.check-guardrails-consumer-boundary]
script = '''
grep -q '^## Consumer tooling boundary$' shared/references/runtime/guardrails.md || {
  echo "shared/references/runtime/guardrails.md is missing ## Consumer tooling boundary" >&2
  echo "Sync from plugins/spec/references/guardrails.md in specify." >&2
  exit 1
}
'''

# Vendored-pin parity (RFC-61): the wit/ and schemas/answers/ trees are
# byte-copies of the augentic/specify sources. When a sibling checkout is
# present (developer machines, the migration branch), any drift fails;
# CI without a sibling checkout skips with a notice.
[tasks.check-pins]
script = '''
sibling="../specify"
if [ ! -d "$sibling" ]; then
  echo "check-pins: no sibling specify checkout; skipping vendored-pin parity"
  exit 0
fi
status=0
for pair in "wit/specify.wit:$sibling/wit/specify.wit" \
            "schemas/answers/leads.schema.json:$sibling/schemas/answers/leads.schema.json" \
            "schemas/answers/evidence.schema.json:$sibling/schemas/answers/evidence.schema.json" \
            "schemas/answers/report.schema.json:$sibling/schemas/answers/report.schema.json"; do
  local_file="${pair%%:*}"
  upstream="${pair#*:}"
  if ! cmp -s "$local_file" "$upstream"; then
    echo "check-pins: $local_file diverges from $upstream; re-vendor from specify" >&2
    status=1
  fi
done
exit $status
'''

# Guest components (RFC-61): build every adapter guest crate for the
# wasm32-wasip2 target the omnia runtime loads.
[tasks.build-guests]
command = "cargo"
args = [
    "build",
    "-p", "specify-contracts",
    "-p", "specify-omnia",
    "-p", "specify-captures",
    "-p", "specify-documentation",
    "-p", "specify-intent",
    "-p", "specify-screenshots",
    "-p", "specify-typescript",
    "-p", "specify-eval-guest",
    "--target", "wasm32-wasip2",
]

# Live decomposition-proof evals (RFC-61 Step 2 Milestone E): every
# contracts scenario through the eval driver against the real cursor
# backend. Requires cursor-agent on PATH; see evals/contracts/README.md.
[tasks.eval-contracts]
script = '''
set -e
for scenario in describe design import source update; do
  evals/contracts/run.sh "$scenario"
done
'''

# Refresh the committed guest components: release-build each adapter guest
# and copy it to `targets/<name>/guest.wasm` beside the adapter manifest
# (the Step-5 cutover replaces `adapter.wasm` with this artifact; until
# then both ship). Run on guest changes, then commit the wasm diff.
[tasks.refresh-guests]
script = '''
set -e
cargo build -p specify-contracts --target wasm32-wasip2 --release
cp target/wasm32-wasip2/release/specify_contracts.wasm targets/contracts/guest.wasm
echo "refreshed targets/contracts/guest.wasm"
'''

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt (mutating; local convenience)
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Fmt check (non-mutating; the gate `check` / `ci` run — a mutating
# `fmt` inside a gate silently rewrites violations instead of failing)
[tasks.fmt-check]
script = "cargo +nightly fmt --all -- --check"

# Lint
[tasks.lint]
command = "cargo"
args = ["clippy", "--locked", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Test
#
# `clean` is deliberately not in the dependency list: the
# `RUSTFLAGS=-Dwarnings` override already differs from the default
# profile, so cargo rebuilds the workspace under these flags regardless,
# making a `cargo clean` cold rebuild redundant cost on every run.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet (check only — regeneration before checking would auto-exempt
# anything unaudited and the gate could never fail)
[tasks.vet]
script = '''
cargo vet --locked
'''
install_crate = "cargo-vet"

# Vet regenerate (manual, on dependency add/update — refresh imports and
# exemptions, then review the `supply-chain/` diff before committing)
[tasks.vet-regenerate]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
'''
install_crate = "cargo-vet"
