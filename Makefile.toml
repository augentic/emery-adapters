# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
# The published `specify:core` component the wasm change example runs.
# The native `lab` crate tracks the sibling `../specify` checkout
# instead (the committed path patch in Cargo.toml).
SPECIFY_CORE_VERSION = "0.27.2"

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = ["fmt", "lint", "test", "test-docs", "doc"]

[tasks.ci]
dependencies = ["check", "vet", "deny"]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint
[tasks.lint]
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Test
#
# `clean` is not necessary as the `RUSTFLAGS=-Dwarnings` override differs
# from the default profile, so cargo rebuilds the workspace.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet
[tasks.vet]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
cargo vet --locked
'''
install_crate = "cargo-vet"

[tasks.release]
command = "cargo"
args = [
  "build",
  "--workspace",
  "--exclude",
  "composed",
  "--exclude",
  "change-example",
  "--exclude",
  "lab",
  "--target",
  "wasm32-wasip2",
  "--release",
]

# -------------------------------------
# The lab crate (native dev shim + live-model eval)
# -------------------------------------
# `crates/lab/` is the unpublished composition binary linking the
# first-party adapters over Specify's `linked` host and lab-only `eval`
# library, consumed from the sibling `../specify` checkout via the
# committed path patch in Cargo.toml. The binary is native-only (`ci`
# builds and lints it; the wasm32 component tasks exclude it); the
# live model rungs below stay operator-invoked.

# The lab CLI passthrough: any specify verb against the native
# shim (`cargo make specify -- --project-dir <dir> slice list`).
[tasks.specify]
command = "cargo"
args = ["run", "-q", "-p", "lab", "--", "${@}"]

# The native live-model trial (the lab binary's `eval` subcommand)
[tasks.eval]
env_files = [".env"]
script = '''
  cargo run -p lab -- eval \
    --fixture examples/change/fixture \
    --change "orders" \
    --intent "Author the API contracts for the orders service described under docs/: the JSON Schema vocabulary plus the HTTP (OpenAPI) surface. Contracts only - no service implementation." \
    --source "docs=documentation:docs" \
    --target "contracts" \
    "$@"
  '''

# -------------------------------------
# Wasm change example + component packaging
# -------------------------------------
# Operator-invoked WIT E2E (not the graded native trial). See
# examples/change/README.md. `adapter` / `publish` share scripts/components.rs.

# Fetch pinned specify:core (wkg; see wit/README.md for registry auth).
[tasks.core-fetch]
script = '''
set -euo pipefail
mkdir -p target/core
wkg get "specify:core@${SPECIFY_CORE_VERSION}" \
  --config wit/config.toml \
  --output target/core/specify.wasm || {
  echo "wkg get specify:core@${SPECIFY_CORE_VERSION} failed." >&2
  echo "Auth: docker login (specify: → private OCI via augentic.io), then retry." >&2
  echo "See wit/README.md." >&2
  exit 1
}
echo "fetched specify:core@${SPECIFY_CORE_VERSION} -> target/core/specify.wasm"
'''

[tasks.change-clean]
script = "rm -rf sandbox/change"

# Prep for the wasm change example: core present, the three composed
# guests, sandbox fixture, and the change-example host.
[tasks.change-build]
script = '''
# set -euo pipefail

# test -f target/core/specify.wasm || {
#   echo "missing target/core/specify.wasm; run \`cargo make core-fetch\` first" >&2
#   exit 1
# }

# The three guests this deployment composes (not a full workspace build).
# cargo make adapter documentation intent contracts

mkdir -p sandbox/change/{workspace,cache,store}
# cp -R examples/change/fixture/. sandbox/change/workspace/
# cp target/wasm32-wasip2/release/contracts.wasm sandbox/change/workspace/contracts.wasm


cargo build -p contracts --target wasm32-wasip2
cargo build -p documentation --target wasm32-wasip2
cargo build -p intent --target wasm32-wasip2

cargo build -p change-example
'''

[tasks.change-run]
dependencies = ["change-clean", "change-build"]
env_files = [".env"]
script = '''
set -euo pipefail

# Per-run loopback for adapter MCP routes (override: HTTP_ADDR=host:port).
export HTTP_ADDR="${HTTP_ADDR:-$(cargo run -q -p change-example --bin change-support -- port)}"
export SPECIFY_DOCUMENTATION_MCP_URL="http://$HTTP_ADDR/mcp/documentation"
export SPECIFY_INTENT_MCP_URL="http://$HTTP_ADDR/mcp/intent"
export SPECIFY_CONTRACTS_MCP_URL="http://$HTTP_ADDR/mcp/contracts"
# Live judgment legs run for minutes; omnia's default is 30s.
export GUEST_TIMEOUT_MS="${GUEST_TIMEOUT_MS:-3600000}"

run() {
  cargo run -q -p change-example -- run --config examples/change/omnia.toml -- "$@"
}

cp target/wasm32-wasip2/release/contracts.wasm sandbox/change/workspace/contracts.wasm

. examples/change/trial.env
run init ./contracts.wasm --name "$TRIAL_PROJECT_NAME"
run plan author "$TRIAL_CHANGE" --intent "$TRIAL_INTENT" --source "$TRIAL_SOURCE"
run plan transition "$TRIAL_CHANGE" approved
run plan execute
run plan status --format json > sandbox/change/status.json

cargo run -q -p change-example --bin change-support -- \
  verify sandbox/change/workspace sandbox/change/status.json
'''

# # Fast component build → target/wasm32-wasip2/release/<name>.wasm
# # (`cargo make adapter contracts`; bare = every adapter). See TESTING.md.
# [tasks.adapter]
# command = "rustup"
# args = [
#   "run",
#   "nightly",
#   "cargo",
#   "-Zscript",
#   "scripts/components.rs",
#   "build-fast",
#   "${@}",
# ]

[tasks.publish]
command = "rustup"
args = [
  "run",
  "nightly",
  "cargo",
  "-Zscript",
  "scripts/components.rs",
  "publish",
]
