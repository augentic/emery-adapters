# Install: `cargo install cargo-make`
# Help: https://sagiegurari.github.io/cargo-make/

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
GUEST_PACKAGES = "contracts omnia-adapter vectis captures documentation intent screenshots typescript"

[config]
default_to_workspace = true
skip_core_tasks = true
skip_crate_env_info = true
skip_git_env_info = true
skip_rust_env_info = true

# -------------------------------------
# CI Checks
# -------------------------------------
[tasks.check]
dependencies = [
  "fmt-check",
  "lint",
  "test",
  "test-docs",
  "doc",
  "check-guardrails-consumer-boundary",
  "check-pins",
]

[tasks.ci]
dependencies = [
  "fmt-check",
  "lint",
  "test",
  "test-docs",
  "doc",
  "vet",
  "deny",
  "check-guardrails-consumer-boundary",
  "check-pins",
]

# -------------------------------------
# Individual Actions
# -------------------------------------

# Audit
[tasks.audit]
command = "cargo"
args = ["audit"]

# Clean
[tasks.clean]
command = "cargo"
args = ["clean"]

# Deny
[tasks.deny]
command = "cargo"
args = ["deny", "--workspace", "check"]
install_crate = "cargo-deny"

# Deps
[tasks.deps]
script = '''
cargo +nightly udeps --all-targets
'''
install_crate = "cargo-udeps"

# Fmt
[tasks.fmt]
script = "cargo +nightly fmt --all"

# Lint
[tasks.lint]
command = "cargo"
args = [
  "clippy",
  "--locked",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
install_crate = { rustup_component_name = "clippy" }

# Outdated (advisory — never part of `ci`: any upstream release would
# fail the gate for unrelated changes; run it on demand or scheduled)
[tasks.outdated]
script = '''
cargo outdated --workspace --depth 1
'''
install_crate = "cargo-outdated"

# Test
#
# `clean` is not necessary as the `RUSTFLAGS=-Dwarnings` override differs
# from the default profile, so cargo rebuilds the workspace.
[tasks.test]
command = "cargo"
args = ["nextest", "run", "--all", "--all-features", "--no-tests=pass"]
env = { RUSTFLAGS = "-Dwarnings" }

# Test Doc
[tasks.test-docs]
command = "cargo"
args = ["test", "--doc", "--all-features", "--workspace"]

# Docs
[tasks.doc]
command = "cargo"
args = ["doc", "--no-deps", "--workspace", "--all-features", "--locked"]
env = { RUSTDOCFLAGS = "-Dwarnings" }

# Miri
[tasks.miri]
script = '''
cargo +nightly miri setup
cargo +nightly miri nextest run --no-tests=pass
'''

# Vet (check only — regeneration before checking would auto-exempt
# anything unaudited and the gate could never fail)
[tasks.vet]
script = '''
cargo vet --locked
'''
install_crate = "cargo-vet"

# Vet regenerate (manual, on dependency add/update — refresh imports and
# exemptions, then review the `supply-chain/` diff before committing)
[tasks.vet-regenerate]
script = '''
cargo vet regenerate imports
cargo vet regenerate exemptions
cargo vet regenerate unpublished
'''
install_crate = "cargo-vet"

[tasks.debug]
script = '''
cargo build --workspace --example eval-guest --target wasm32-wasip2
'''

[tasks.release]
script = '''
cargo build --workspace --target wasm32-wasip2 --release
'''

# Live decomposition-proof evals (RFC-61 Step 2 Milestone E): every
# contracts scenario through the `#[ignore]`d tests in evals/live.rs
# against the real cursor backend. Requires cursor-agent on PATH; see
# evals/contracts/README.md.
[tasks.eval-contracts]
script = '''
cargo test -p evals --test live -- --ignored --nocapture contracts::
'''

# Live build-leg eval for the vectis adapter guest (RFC-61 Step 3
# Milestone D): the single-screen scenario through the `#[ignore]`d
# tests in evals/live.rs against the real cursor backend. Requires
# cursor-agent on PATH; see evals/vectis/README.md.
[tasks.eval-vectis]
script = '''
cargo test -p evals --test live -- --ignored --nocapture vectis::
'''

# Prose-overlay watch loop: re-run one live scenario on every
# save under an adapter's prose trees. With SPECIFY_EVAL_OVERLAY=1 the
# save-to-report loop is the overlay loop — after the one-time build a
# re-run spawns no cargo, only the model leg repeats. Parametrized by
# EVAL_ADAPTER (default contracts) and EVAL_FILTER (required: a
# single-scenario live-test filter, e.g. contracts::design — one model
# leg per save is the loop's whole point). Watches
# targets/<adapter>/prose — the adapters the evals exercise today are
# all targets; a sources/ adapter would need the prefix taught here. A
# script task over cargo-watch (installed on demand) rather than
# cargo-make's native `watch` attribute: the watched path is
# env-parametrized, which the shell expresses directly. Requires
# cursor-agent on PATH.
[tasks.eval-watch]
script = '''
adapter="${EVAL_ADAPTER:-contracts}"
if [ -z "${EVAL_FILTER:-}" ]; then
  echo "eval-watch: EVAL_FILTER is required — name one scenario, e.g." >&2
  echo "  EVAL_FILTER=contracts::design cargo make eval-watch" >&2
  echo "(a bare \`${adapter}::\` prefix fans out to every live scenario of the adapter)" >&2
  exit 1
fi
prose="targets/${adapter}/prose"
if [ ! -d "$prose" ]; then
  echo "eval-watch: no prose tree at $prose (sources/ adapters need a different prefix)" >&2
  exit 1
fi
# EVAL_FILTER is re-evaluated by the `sh -c` cargo-watch spawns: a value
# with spaces becomes multiple filters; metacharacters execute.
# Operator-supplied env, so informational only.
cargo watch -w "$prose" -s "SPECIFY_EVAL_OVERLAY=1 cargo test -p evals --test live -- --ignored --nocapture $EVAL_FILTER"
'''
install_crate = "cargo-watch"

# Publish every adapter component as `$REGISTRY_NAMESPACE:<name>@<ver>`
# (RFC-64 identity, RFC-66 idempotency). Walks targets/*/ sources/*/,
# reads each guest crate's identity semver from cargo metadata, and
# pushes the release-built `target/wasm32-wasip2/release/<name>.wasm`
# through scripts/wkg-publish-idempotent.sh: the helper probes the
# registry first and skips identities already present, so a tag carrying
# a mixed bag of bumped and untouched adapters succeeds — a version is
# published at most once, ever, and a probe that cannot distinguish
# absent from unreachable aborts rather than risk re-pushing an
# immutable identity. Requires `cargo make build-guests-release` first
# (components are built up front; the helper's build leg is unused) and
# a wkg config routing the namespace (CI writes one from GITHUB_TOKEN;
# local emergency publishing runs this same task with the developer's
# own token in their wkg config). Namespace defaults to `specify`
# (RFC-65: namespaces follow product, not org); override via
# REGISTRY_NAMESPACE.
[tasks.publish]
script_runner = "bash"
script = '''
set -euo pipefail
namespace="${REGISTRY_NAMESPACE:-specify}"
metadata="$(cargo metadata --no-deps --format-version 1)"
for dir in targets/*/ sources/*/; do
  name="$(basename "${dir}")"
  pkg="$(sed -n 's/^name = "\(.*\)"/\1/p' "${dir}Cargo.toml" | head -1)"
  version="$(jq -r --arg n "${pkg}" \
    '.packages[] | select(.name == $n) | .version' <<< "${metadata}")"
  if [ -z "${version}" ] || [ "${version}" = "null" ]; then
    echo "publish-adapters: no ${pkg} package version in cargo metadata" >&2
    exit 1
  fi
  artifact="target/wasm32-wasip2/release/${name}.wasm"
  if [ ! -s "${artifact}" ]; then
    echo "publish-adapters: missing release component ${artifact}; run \`cargo make build-guests-release\` first" >&2
    exit 1
  fi
  scripts/wkg-publish-idempotent.sh "${namespace}:${name}@${version}" "${artifact}"
done
'''

