[package]
name = "typescript"
description = "TypeScript source-adapter"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# `model-survey`: the surfaces are named by the model in one turn from the
# facts the parser read, in place of the parser's own — an experiment's arm,
# never the shipped default.
[features]
model-survey = []

[dependencies]
emery-sdk.workspace = true

# The parser the survey reads the tree with; guest code alone, so a native
# build compiles `PROSE` and nothing else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
