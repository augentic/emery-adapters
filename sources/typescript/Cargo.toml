[package]
name = "typescript"
description = "TypeScript source-adapter"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Default on so `cargo build -p typescript` still exports the component.
# The root-package example turns this off and calls `source!` itself.
[features]
default = ["export"]
export = []

[lints]
workspace = true

[dependencies]
emery-sdk.workspace = true
emery-prose.workspace = true

[build-dependencies]
emery-prose = { workspace = true, features = ["emit"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

# The scripted model `tests/extract.rs` binds; the built component's seam
# suite is the root package's.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-test = { workspace = true, features = ["guest"] }
