[package]
name = "screenshots"
description = "Screenshots source-adapter"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

# `cdylib` is the wasm32 component; `rlib` lets the native integration
# tests and doctests link the wasm-free modules.
[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
adapter.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3.workspace = true

[build-dependencies]
prose.workspace = true

[dev-dependencies]
testkit.workspace = true
tokio.workspace = true
