[package]
name = "documentation-core"
description = "Wasm-free core of the documentation source adapter: embedded prose registry and the survey / extract judgment operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
adapter.workspace = true

[build-dependencies]
prose.workspace = true

[dev-dependencies]
testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
