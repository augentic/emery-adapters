[package]
name = "documentation"
description = "Documentation source-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# The experiment arms (evals/cards/README.md, "The documentation survey
# experiment"): the default build cuts a tree by directory; `model-survey`
# has the model name the tree's subjects and cuts the seams from them;
# `anchors` holds each requirement to the rule-bearing lines of its subject.
model-survey = []
anchors = ["model-survey"]

[dependencies]
emery-sdk.workspace = true
