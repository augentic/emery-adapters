[package]
name = "harness"
description = "Hosted-deployment harness for composed WASM/WIT conformance and live prompt-quality evaluation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "harness.rs"

[dependencies]
cfg-if.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-testkit = { workspace = true, features = ["runtime"] }
prose.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[example]]
name = "eval-driver"
path = "runtime.rs"
test = true

[[example]]
name = "eval-guest"
path = "guest.rs"
crate-type = ["cdylib"]

[[test]]
name = "live"
path = "live.rs"

[[test]]
name = "composed"
path = "composed.rs"

[lints]
workspace = true
