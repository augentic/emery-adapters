openapi: "3.0.3"
info:
  title: Ticket API
  version: "1.0.0"
paths:
  /tickets:
    post:
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
components:
  schemas:
    CreateTicketRequest:
      type: object
      required: [subject, requester_email]
      properties:
        subject:
          type: string
        requester_email:
          type: string
          format: email
    Ticket:
      type: object
      required: [id, subject, status]
      properties:
        id:
          type: string
        subject:
          type: string
        status:
          type: string
          enum: [open, pending, closed]
