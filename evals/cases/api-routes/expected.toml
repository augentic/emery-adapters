# A Next.js app-router API: four route modules a framework routes by file
# path, each exporting its handlers (`GET`, `POST`, `DELETE`), and nothing
# that runs at load — no bootstrap, no registration, no decorator. The tree
# fits one message. The surfaces are a convention the parser has not been
# taught, so this case is where the survey's two arms are expected to part:
# the parser falls back to the route modules' exports (`get`, `post`,
# `delete` as stems), while a survey that reads the file paths names the
# resources. Written before any run.

fixture = "evals/cases/api-routes/fixture"
stems = ["orders", "customers", "health"]

# --- surfaces: one pair per route module, under the resource its path spells ---

[[surface]]
entry = "app/api/orders/route.ts"
stem = "orders"

[[surface]]
entry = "app/api/orders/[id]/route.ts"
stem = "orders"

[[surface]]
entry = "app/api/customers/route.ts"
stem = "customers"

[[surface]]
entry = "app/api/health/route.ts"
stem = "health"

# --- orders ---

[[requirement]]
stem = "orders"
anchor = "app/api/orders/route.ts#L30-L33"
gloss = "GET /api/orders lists orders newest first, filtered by `state`, with `limit` defaulting to DEFAULT_PAGE_SIZE and capped at MAX_PAGE_SIZE; a non-numeric or non-positive limit falls back to the default"

[[requirement]]
stem = "orders"
anchor = "app/api/orders/route.ts#L44-L46"
gloss = "POST /api/orders rejects a body failing PlaceOrderSchema with 400 `invalid-order` and the issues"

[[requirement]]
stem = "orders"
anchor = "app/api/orders/route.ts#L48-L50"
gloss = "POST /api/orders for an unknown customer is 422 `unknown-customer`"

[[requirement]]
stem = "orders"
anchor = "app/api/orders/route.ts#L51-L53"
gloss = "A valid order is priced for the customer's tier and promo code, stored as `placed`, and answered 201 with a Location header"

[[requirement]]
stem = "orders"
anchor = "lib/pricing.ts#L22-L24"
gloss = "The discount is the greater of the tier's rate and the promo's — a listed PROMO_CODE, case-insensitive — never both"

[[requirement]]
stem = "orders"
anchor = "lib/pricing.ts#L26-L27"
gloss = "Shipping is free from FREE_SHIPPING_THRESHOLD_CENTS of discounted subtotal, else SHIPPING_CENTS; GST_RATE applies to the discounted subtotal plus shipping"

[[requirement]]
stem = "orders"
anchor = "app/api/orders/[id]/route.ts#L13-L15"
gloss = "GET /api/orders/:id for an unknown id is 404 `not-found`"

[[requirement]]
stem = "orders"
anchor = "app/api/orders/[id]/route.ts#L29-L31"
gloss = "DELETE /api/orders/:id of a shipped order is 409 `already-shipped`"

[[requirement]]
stem = "orders"
anchor = "app/api/orders/[id]/route.ts#L32-L33"
gloss = "DELETE /api/orders/:id cancels the order and answers 204"

# --- customers ---

[[requirement]]
stem = "customers"
anchor = "app/api/customers/route.ts#L17-L22"
gloss = "GET /api/customers with `email` answers the one customer at that address, lowercased, or an empty list; without it, every customer"

[[requirement]]
stem = "customers"
anchor = "app/api/customers/route.ts#L32-L34"
gloss = "POST /api/customers rejects a body failing CustomerSchema with 400 `invalid-customer`"

[[requirement]]
stem = "customers"
anchor = "app/api/customers/route.ts#L36-L38"
gloss = "POST /api/customers with an email already registered, case-insensitively, is 409 `duplicate-email`"

[[requirement]]
stem = "customers"
anchor = "app/api/customers/route.ts#L39-L40"
