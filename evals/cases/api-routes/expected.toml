# --- health ---

[[requirement]]
stem = "health"
anchor = "app/api/health/route.ts#L10-L16"
gloss = "GET /api/health answers `ok`, the uptime in seconds, and the order count with `Cache-Control: no-store`, without authentication"

# --- reached by every route, so no stem is expected ---

[[requirement]]
anchor = "lib/auth.ts#L14-L16"
gloss = "A request without `Authorization: Bearer <token>` naming one of API_TOKENS is 401 `unauthorized`"

[[requirement]]
anchor = "lib/errors.ts#L16-L23"
gloss = "An HttpError answers its status and code, a body that is not JSON is 400 `malformed-json`, anything else is logged and 500 `internal`"

# --- criteria ---

[[criterion]]
anchor = "app/api/orders/route.ts#L11-L12"
gloss = "DEFAULT_PAGE_SIZE is 20 and MAX_PAGE_SIZE is 100"

[[criterion]]
anchor = "app/api/orders/route.ts#L14-L24"
gloss = "PlaceOrderSchema: a uuid customerId, at least one line with a positive integer quantity and a non-negative unit price, an optional promoCode"

[[criterion]]
anchor = "app/api/customers/route.ts#L8-L12"
gloss = "CustomerSchema: an email, a name of 1–120 characters, a tier of TIERS defaulting to standard"

[[criterion]]
anchor = "lib/pricing.ts#L3-L8"
gloss = "TIER_DISCOUNT 0 / 0.05 / 0.1, PROMO_CODES, PROMO_DISCOUNT 0.15, FREE_SHIPPING_THRESHOLD_CENTS 15000, SHIPPING_CENTS 850, GST_RATE 0.15"

[[criterion]]
anchor = "lib/auth.ts#L6-L9"
gloss = "API_TOKENS is read from the environment, comma-separated, blanks dropped"
