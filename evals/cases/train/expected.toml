# The train position adapter, the service the live typescript example
# reads, vendored whole under `fixture/` with no git reference: a Kafka
# consumer of train-update XML publishing vehicle location events,
# bootstrapped from `src/start.ts`.
# Private wrapper packages (`realtime-common`, `connector-common`)
# hide the frameworks, so the one registration is `consumer.onMessage` in
# `Main.start`, led by no literal: by the survey prompt's rule its stem is
# the type the callback parses, `train-update`, never `kafka-consumer`. The
# bootstrap reaches `KeyVault` through the secret retriever and nothing
# else does, so the facts list it as a service module and it is a surface
# of its own; the two API clients are reached from `Main`, so they are
# mined through the consumer's seam and the bootstrap's alike, and a
# requirement at one is rightly placed under either stem. Beside the
# source sits `reference/`, a trimmed copy of the hand-written omnia guest
# the same behaviour was ported to, which a `--build --target omnia` run
# compares the built guest with and drives its 22 recorded fixtures
# through.

reference = "evals/cases/train/reference"

[[source]]
adapter = "typescript"
fixture = "evals/cases/train/fixture"
stems = ["start", "train-update", "key-vault"]

# --- surfaces: the bootstrap, the one message handler `Main.start`
# registers on the consumer, and the Key Vault client only the bootstrap
# reaches ---

[[source.surface]]
entry = "src/start.ts"
stem = "start"

[[source.surface]]
entry = "src/main.ts"
stem = "train-update"

[[source.surface]]
entry = "src/key-vault.ts"
stem = "key-vault"

