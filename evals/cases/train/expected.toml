# The train position adapter, the service the live typescript example
# reads, vendored whole under `fixture/` with no git reference: a Kafka
# consumer of train-update XML publishing vehicle location events,
# bootstrapped from `src/start.ts`.
# Private wrapper packages (`realtime-common`, `connector-common`)
# hide the frameworks, so the one registration is `consumer.onMessage` in
# `Main.start`, led by no literal: by the survey prompt's rule its stem is
# the type the callback parses, `train-update`, never `kafka-consumer`.
# Everything else the bootstrap does — the Confluent secret read from Key
# Vault and watched for rotation, the consumer and producer constructed,
# the APM transaction, the status check and the status log, the stop and
# the exit timers, the stops prefetched and refreshed hourly, the token
# retriever provided — is how the process readies itself, reaches other
# systems, and shuts down: the design's, in `excerpt` and `call` claims,
# and no requirement's. So the specification is `train-update` alone, the
# `start` surface holds no requirement, and the readiness spans are
# listed `[[absent]]`, each a hit when a run states a requirement there.
# The two API clients are reached from `Main` and mined through the
# consumer's seam; the allocation lookup's business face — the vehicles of
# a train's trip, none when the lookup fails — is the one requirement at a
# client. Beside the source sits `reference/`, a trimmed copy of the
# hand-written omnia guest the same behaviour was ported to, which a
# `--build --target omnia` run compares the built guest with and drives
# its 22 recorded fixtures through.

reference = "evals/cases/train/reference"

[[source]]
adapter = "typescript"
fixture = "evals/cases/train/fixture"
stems = ["train-update"]

