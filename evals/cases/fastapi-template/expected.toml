# five routes under no prefix, tagged `login`
[[surface]]
entry = "app/api/routes/login.py"
stem = "login"

# `POST /utils/test-email/` and `GET /utils/health-check/`
[[surface]]
entry = "app/api/routes/utils.py"
stem = "utils"

# `POST /private/users/`, included in development alone
[[surface]]
entry = "app/api/routes/private.py"
stem = "private"

