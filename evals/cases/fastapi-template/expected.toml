# fastapi/full-stack-fastapi-template at cb740b65 (MIT), the repository's
# `backend/` directory vendored by the command in evals/README.md and
# gitignored: 20 production modules, ~37 KB, within the 64 KB the survey
# lays into one message, so every module is laid into one seam. A FastAPI
# service the way the framework's own template writes one: `app/main.py`
# constructs `app = FastAPI(..)` at load with no guard and no console script
# (the construction-at-load bootstrap on a real tree), mounts the API router
# under `settings.API_V1_STR` — a prefix the code does not spell — and
# serves the frontend at `/`; `app/api/main.py` includes five `APIRouter`s,
# four under a prefix of their own (`/items`, `/users`, `/utils`,
# `/private`) and the login router under none, with `tags=["login"]` as its
# one grouping; the private router is included only in development. Shared
# guards in `app/api/deps.py` resolve the current user and the superuser;
# `app/core/config.py` is a pydantic settings class whose validators rewrite
# the database driver and refuse default secrets at startup; `alembic/`
# holds the migration environment, its `versions/` skipped by the keep.
# Written from the facts dump and the code before any run.
#
# The login router's five routes spell four resources (`login`,
# `password-recovery`, `reset-password`, `password-recovery-html-content`)
# under the route convention alone; the expectation wants them under the
# one stem the router's tag spells, `login`, since the plan slices by stem
# and a resource of one route is no slice. The first baseline card read the
# three extra stems on 3/3, as predicted, and the derivation now reads a
# prefix-less router's first tag as the resource its routes sit under.

adapter = "python"
fixture = "evals/cases/fastapi-template/fixture"
stems = ["start", "items", "users", "login", "utils", "private"]

# --- surfaces: the bootstrap and the five routers' routes ---

[[surface]]
entry = "app/main.py"
stem = "start"

# five routes under `/api/v1/items`
[[surface]]
