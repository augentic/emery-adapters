[project]
name = "ledger-tool"
version = "0.9.1"
description = "Ledger import, reconciliation, and invoice processing for the finance team"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "celery[redis]>=5.4",
    "click>=8.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]

[project.scripts]
ledger = "ledger.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
