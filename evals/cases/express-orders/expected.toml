# An Express orders API over pg and Redis with zod validation, a `tsconfig`
# `paths` alias (`@app/*`), and a postcode table that carries the kept tree
# past the SDK's inline budget, so the tree is surveyed and mined by surface.

fixture = "examples/typescript/express-orders"
stems = ["start", "orders", "customers", "health"]

