# The express-orders oracle: the Express service's behaviour recorded as
# HTTP scenarios, which the eval drives through the guest an `omnia` build
# leaves. There is no reference guest beside it: the scenarios are the
# behaviour, each a sequence of requests over one fresh store, and every
# totals expectation was recomputed from the fixture's own `pricing.ts`.
#
# The harness lends the guest an in-memory table store emulating the
# contract its queries were written against (`$N` parameters bound by
# number, the declared column types, `expr::type` casts), `schema.sql`
# applied and `seed/tables/*.json` inserted before each scenario, the rates
# service answered at `SHIPPING_API_URL` from each scenario's `seed.rates`,
# and every key below as its configuration.

kind = "http"

# Every `/api` request carries `Bearer <token>` unless its step sets the
# header itself.
[auth]
header = "authorization"
token = "test-token"
guarded = "/api"

# The settings the scenarios were recorded under, by the source's own names:
# its environment variables with their defaults and the constants it holds
# in code, since a port may read either as a setting. A key the built guest
# spells otherwise is seeded by its longest `_`-suffix here (`ORDERS_GST_RATE`
# from `GST_RATE`), else by the harness's generic patterns.
[config]
API_TOKENS = "test-token"
BEARER_PREFIX = "Bearer "
BULK_DISCOUNT_MIN_UNITS = "24"
BULK_DISCOUNT_RATE = "0.05"
CACHE_TTL_SECONDS = "300"
DATABASE_URL = "postgres://api.test/orders"
DEFAULT_PAGE_SIZE = "20"
FREE_SHIPPING_THRESHOLD_CENTS = "10000"
GST_RATE = "0.15"
KEY_PREFIX = "orders-api:"
LOG_LEVEL = "info"
MAX_ATTEMPTS = "3"
MAX_COURIER_NOTE = "200"
MAX_EMAIL = "254"
MAX_LINES = "50"
MAX_LINE_QUANTITY = "999"
MAX_NAME = "80"
MAX_PAGE_SIZE = "100"
NZ_POSTCODE = '^\d{4}$'
ORDER_CACHE_TTL_SECONDS = "60"
PORT = "3000"
PROBE_TIMEOUT_MS = "2000"
REDIS_URL = "redis://api.test:6379"
REQUEST_TIMEOUT_MS = "5000"
RETRY_BACKOFF_MS = "250"
RURAL_SURCHARGE_CENTS = "650"
SHIPPING_API_KEY = "rates-key"
SHIPPING_API_URL = "http://api.test"
SHUTDOWN_GRACE_MS = "10000"
SKU_PATTERN = '^[A-Z]{2,4}-\d{3,6}$'
SLOW_REQUEST_MS = "1000"
TRADE_DISCOUNT_RATE = "0.1"
VIP_DISCOUNT_RATE = "0.15"
