# The order events service from two sources whose own words are the
# technology's: two decision records (`docs`) choosing the broker and the
# secret store by name, and the TypeScript service (`code`) whose
# identifiers spell them — `useConfluentKafkaConfig`,
# `ConfluentSecretRetriever`, `KeyVault`, `kafkajs`. The technology case:
# every requirement and criterion the run accepts, and every stem, scenario
# line, and preamble paragraph it writes, is read against the lexicon
# (`leaks`, expected 0); each record's prescription is a `decision` the
# design lands (`recall dec`); and the rule each record decides is a
# requirement by role that the code states too (the behaviours). The code's
# secret-store surface is `class KeyVault`, which the survey prompt's rule
# names `secrets` and the SDK's gate returns as `key-vault`, so the stem is
# the gate's doing; the bootstrap's credential steps are `start`'s by role,
# never the retriever's name. The two records' stems are the model's: the
# broker record is about the orders its events are, the credentials record
# about the secrets it keeps.

[[source]]
name = "docs"
adapter = "documentation"
fixture = "evals/cases/orders-broker/docs"
stems = ["orders", "secrets"]

[[source.surface]]
entry = "adr/0001-order-events-broker.md"
stem = "orders"

[[source.surface]]
entry = "adr/0002-broker-credentials.md"
stem = "secrets"

[[source]]
name = "code"
adapter = "typescript"
fixture = "evals/cases/orders-broker/fixture"
stems = ["start", "orders", "secrets"]

[[source.surface]]
entry = "src/start.ts"
stem = "start"

[[source.surface]]
entry = "src/orders.ts"
stem = "orders"

[[source.surface]]
entry = "src/key-vault.ts"
stem = "secrets"

