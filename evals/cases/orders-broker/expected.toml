# The order events service from two sources whose own words are the
# technology's: two decision records (`docs`) choosing the broker and the
# secret store by name, and the TypeScript service (`code`) whose
# identifiers spell them — `useConfluentKafkaConfig`,
# `ConfluentSecretRetriever`, `KeyVault`, `kafkajs`. The technology case:
# every requirement and criterion the run accepts, and every stem, scenario
# line, and preamble paragraph it writes, is read against the lexicon
# (`leaks`, expected 0); each record's prescription is a `decision` the
# design lands (`recall dec`); and the rule each record decides is a
# requirement by role (the behaviours). The code's credential steps — the
# secret read, parsed, and watched for rotation, the producer constructed
# from it, the restart — are how the process readies itself and reaches the
# broker: the design's, in `excerpt` and `call` claims, and no
# requirement's, so `start` holds the one rule every request gets and the
# readiness spans are listed `[[absent]]`, each a hit when a run states a
# requirement there; `KeyVault` and the retriever are mechanisms reached
# through the bootstrap, never surfaces, so no stem spells them and the
# lexicon's stem gate has nothing to return here. The two records' stems are
# the model's: the broker record is about the orders its events are, the
# credentials record about the secrets it keeps.

[[source]]
name = "docs"
adapter = "documentation"
fixture = "evals/cases/orders-broker/docs"
stems = ["orders", "secrets"]

[[source.surface]]
entry = "adr/0001-order-events-broker.md"
stem = "orders"

[[source.surface]]
entry = "adr/0002-broker-credentials.md"
stem = "secrets"

