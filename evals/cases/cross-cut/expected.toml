# A documentation tree past INLINE_BYTES (twenty files, ~70 KB) in three
# directories — guides, reference, policies — written to break the
# directory cut the way `hono-mounted` breaks a parser's conventions: one
# subject, `returns`, is stated across three files in three directories
# (the guide, the reference, the late-returns policy), and one file,
# `reference/accounts.md`, holds three subjects (membership, signing in,
# password reset). Mined a directory at a time, the three `returns`
# documents are three calls that each name the subject their own way; mined
# a subject at a time, they are one seam. The README, the error-code table,
# the glossary, and the changelog are no subject: `unreached`.

[[source]]
name = "docs"
adapter = "documentation"
fixture = "evals/cases/cross-cut/fixture"
stems = [
  "membership",
  "sign-in",
  "password-reset",
  "catalogue",
  "loans",
  "reservations",
  "returns",
  "damage",
  "notifications",
]

# --- subjects: the (entry, stem) pairs the survey decides ---

[[source.surface]]
