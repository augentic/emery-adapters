# brocoders/nestjs-boilerplate at 9620f159 (MIT), vendored by the command in
# examples/README.md and gitignored: 177 production modules, ~236 KB, well
# past the 64 KB the survey lays into one message, so this is the scale case
# — most modules reach a survey by model only through the lend. A NestJS
# application: `src/main.ts` bootstraps, nine controllers under object-form
# `@Controller({ path, version })` decorators register the routes (the four
# `auth*` controllers share the `auth` resource, the three `files` uploaders —
# local, S3, S3 presigned, one chosen by config — share `files`), and
# `@Controller()` with no path serves `GET /`. Eight config modules hand a
# factory to `registerAs('<name>', …)`, which is a namespace and no surface.
# The two `run-seed.ts` scripts are each run by a manifest script
# (`seed:run:relational`, `seed:run:document`) as a module of its own, so by
# the survey prompt's command rule each is a surface anchored at the
# top-level statement that runs it, under its module's name `run-seed` —
# two surfaces under one stem, told apart by the directory each sits in.
# Written before any run; the seed runners were read as unreached until the
# treatment named them on six of six runs under the prompt's rule, when the
# expectation moved to the prompt's reading.

fixture = "examples/typescript/nestjs-boilerplate"
stems = ["start", "auth", "users", "files", "home", "run-seed"]

# --- surfaces: the bootstrap, the nine controllers, and the two seed runners ---

