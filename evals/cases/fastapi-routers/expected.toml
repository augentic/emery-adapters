# A FastAPI service past the inline budget: the manifest's console script
# enters `app.main`, which mounts three `APIRouter`s under `/api/v1` and at
# the root, a middleware, and four exception handlers; the tree's module
# text exceeds `INLINE_BYTES` (a generated postcode table carries most of
# it), so the survey cuts one seam per stem, each laying the surfaces under
# it and the union of their closures, with the `rates.json` the pricing
# module reads by path laid after the modules as a data file. Mirrors
# `express-orders`.

adapter = "python"
fixture = "evals/cases/fastapi-routers/fixture"
stems = ["start", "orders", "customers", "health"]

# --- surfaces: the (entry, stem) pairs the survey decides ---

[[surface]]
entry = "app/main.py"
stem = "start"

# the five routes under `/api/v1/orders`, one surface each
[[surface]]
entry = "app/routers/orders.py"
stem = "orders"

# the three routes under `/api/v1/customers`
[[surface]]
entry = "app/routers/customers.py"
stem = "customers"

# `/health` and `/health/ready`, mounted at the root
[[surface]]
entry = "app/routers/health.py"
stem = "health"

# --- start ---

[[requirement]]
stem = "start"
anchor = "app/main.py#L19-L25"
gloss = "On startup the cache connects and readiness is logged; on shutdown the shipping client and the cache close"

[[requirement]]
stem = "start"
anchor = "app/main.py#L30-L35"
gloss = "CORS allows the configured origins for GET, POST and PUT with authorization and content-type headers"

[[requirement]]
stem = "start"
anchor = "app/main.py#L38-L43"
gloss = "Every response carries a server-timing header with the handling duration"

[[requirement]]
stem = "start"
anchor = "app/main.py#L46-L64"
gloss = "NotFoundError is 404, ConflictError 409 with the state, ValidationError 422 with the field, UpstreamError 502 with the system and a logged error"

[[requirement]]
stem = "start"
anchor = "app/main.py#L72-L73"
gloss = "The console script serves app.main:app on the configured port at the configured log level"

