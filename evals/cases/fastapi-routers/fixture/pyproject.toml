[project]
name = "shopapi"
version = "1.2.0"
description = "Orders and customers API for the shop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
shopapi = "app.main:serve"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
