# The multi-repo consolidation case: two TypeScript transit services that are
# one pipeline, read through one `specify` and ported into one guest.
# `connector` is the train SOAP connector, vendored whole under `fixture/`
# with no git reference: a SOAP server on `/inbound/xml` that checks
# train-update XML and publishes it raw to the `realtime-train.v1` topic.
# `adapter` is the train position adapter, the `train` case's fixture read
# again: the consumer of that topic, publishing vehicle location events.
# Each is bootstrapped from its own `src/start.ts`, so both lead with `start`
# — two bootstraps under one stem, where a byte-equal id pre-merges across
# sources — and each reaches `KeyVault` through a secret retriever only its
# bootstrap uses, so each has a `key-vault` surface, as the `train` case
# expects of the adapter. The connector's one surface is the SOAP service
# `soap.listen` serves on `/inbound/xml` in `SoapServer.start`: the route rule
# gives it `inbound`, and the code spells no stem there, since the path is the
# call's second argument. The facts locate neither it nor the service modules —
# the service is handed as an object rather than a function, and the one
# registration the facts list is the `on` hook inside the producer's options in
# `start.ts`, which makes the bootstrap the one locating module and stops the
# service walk at it — so both surfaces are the model's to find in the modules
# laid whole, which is what the case measures of the survey. Beside the sources
# sits `reference/`, a trimmed copy of the hand-written omnia guest the two
# were ported into — one crate per service, the topic constant the one thing
# they share — which a `--build --target omnia` run compares the built guest
# with and drives the adapter's 22 recorded fixtures through.

reference = "evals/cases/train-pair/reference"

[[source]]
name = "connector"
adapter = "typescript"
fixture = "evals/cases/train-pair/fixture"
stems = ["start", "inbound", "key-vault"]

# --- connector surfaces: the bootstrap, the SOAP service `SoapServer.start`
# serves on `/inbound/xml`, and the Key Vault client only the bootstrap
# reaches ---

