# The multi-repo consolidation case: two TypeScript transit services that are
# one pipeline, read through one `specify` and ported into one guest.
# `connector` is the train SOAP connector, vendored whole under `fixture/`
# with no git reference: a SOAP server on `/inbound/xml` that checks
# train-update XML and publishes it raw to the `realtime-train.v1` topic.
# `adapter` is the train position adapter, the `train` case's fixture read
# again: the consumer of that topic, publishing vehicle location events.
# Each is bootstrapped from its own `src/start.ts`, so each has a `start`
# surface — and, under the one rule, neither bootstrap states a requirement:
# the secret read from Key Vault and watched for rotation, the producer
# constructed from its config, the status check, the stop, and the exit
# timers are how each process readies itself and shuts down, the design's in
# `excerpt` and `call` claims, and every such span is listed `[[absent]]` per
# source. So the connector's specification is `inbound` alone and the
# adapter's `train-update` alone, as the `train` case expects of it. The
# connector's one surface is the SOAP service `soap.listen` serves on
# `/inbound/xml` in `SoapServer.start`: the route rule gives it `inbound`,
# and the code spells no stem there, since the path is the call's second
# argument. The facts do not locate it — the service is handed as an object
# rather than a function, and the one registration the facts list is the
# `on` hook inside the producer's options in `start.ts`, which makes the
# bootstrap the one locating module — so the surface is the model's to find
# in the modules inlined whole, which is what the case measures of the survey.
# Beside the sources sits `reference/`, a trimmed copy of the hand-written
# omnia guest the two were ported into — one crate per service, the topic
# constant the one thing they share — which a `--build --target omnia` run
# compares the built guest with and drives the adapter's 22 recorded
# fixtures through.

reference = "evals/cases/train-pair/reference"

[[source]]
name = "connector"
adapter = "typescript"
fixture = "evals/cases/train-pair/fixture"
stems = ["inbound"]

# --- connector surfaces: the bootstrap and the SOAP service
# `SoapServer.start` serves on `/inbound/xml` ---

[[source.surface]]
entry = "src/start.ts"
stem = "start"

[[source.surface]]
entry = "src/soap-server.ts"
stem = "inbound"

[[source]]
name = "adapter"
