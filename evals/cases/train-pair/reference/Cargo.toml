[package]
name = "train"
description = "Train realtime WASM guest: the SOAP connector and position adapter"
readme = "README.md"
publish = false
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The local host: `cargo run --features host --example runtime -- run target/wasm32-wasip2/release/train.wasm`.
host = ["dep:omnia", "dep:omnia-wasi-config", "dep:omnia-wasi-identity", "dep:omnia-wasi-keyvalue"]

[dependencies]
axum.workspace = true
common.workspace = true
omnia-sdk.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-otel.workspace = true
position-adapter.workspace = true
soap-connector.workspace = true
tracing.workspace = true
wasip3.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia = { workspace = true, optional = true }
omnia-wasi-config = { workspace = true, optional = true }
omnia-wasi-identity = { workspace = true, optional = true }
omnia-wasi-keyvalue = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
bytes.workspace = true
chrono.workspace = true
http.workspace = true
omnia-test = { workspace = true, features = ["guest"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower.workspace = true

[[example]]
name = "runtime"
path = "examples/runtime.rs"
required-features = ["host"]

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["realtime"]
edition = "2024"
exclude = [".*", "/docs"]
homepage = "https://augentic.io"
keywords = ["realtime", "train"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/augentic/train"
rust-version = "1.99"
version = "0.3.0"

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
http = "1.5.0"
http-body-util = "0.1.5"
quick-xml = { version = "0.41.0", features = ["serde", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false, features = [
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
wasip3 = { version = "0.9.0", features = ["http-compat"] }

# Every `omnia-*` line below moves together: bump them to the same release
# in one change, and keep the shared pins above (`wasip3`, `http`, `axum`,
# `tokio`, …) at the versions omnia itself pins so the guest links one copy
# of each. Never add a `[patch.crates-io]` git or path override here — the
# crates are published.
omnia = "0.36.0"
omnia-sdk = "0.36.0"
omnia-wasi-config = "0.36.0"
omnia-wasi-http = "0.36.0"
omnia-wasi-identity = "0.36.0"
omnia-wasi-keyvalue = "0.36.0"
omnia-wasi-messaging = "0.36.0"
omnia-wasi-otel = "0.36.0"
# No default features: each consumer names its rung (`guest`, `host`) so
# the dependency graph never drags in more than the rung needs.
omnia-test = "0.36.0"

# Internally referenced crates
common = { path = "crates/common" }
position-adapter = { path = "crates/position-adapter" }
soap-connector = { path = "crates/soap-connector" }

[profile.release]
lto = true
opt-level = "s"
strip = true
