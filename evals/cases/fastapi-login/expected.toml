# The login screen of fastapi/full-stack-fastapi-template at cb740b65 (MIT),
# read as screen behaviour rather than as code: the `behaviour` adapter's
# first case. The fixture is the template's `frontend/` trimmed to the eight
# modules `ui-ir/login/behaviour.json` cites, byte-equal to the pinned
# commit, beside that document and the repository's licence. The document is
# ui-ir's (`augentic/ui-ir-experiment`, branch `experiment/behaviour`):
# `code-to-behaviour` read the tree statically and `capture-to-behaviour`
# recorded five Playwright runs against the running template — the guard,
# links, validation, a failed and a successful sign-in — so twelve triggers,
# one guard, and three validation rules carry `file#L` evidence and five of
# them `observed` steps. The adapter cuts one seam per document, stem
# `login` from its `screen`, and joins the document's `call` and `example`
# claims without a model turn; every `requirement` and `criterion` is the
# model's, marked `inferred`.
#
# A baseline, not a target: written from the document, the cited code, and
# `--facts` before any graded run, so a later card reads where the
# extraction stands. The theme menu, the footer links, and the logo are
# shared components the login route renders; the document lists their
# triggers as the screen's, so they are expected here.

[[source]]
name = "behaviour"
adapter = "behaviour"
fixture = "evals/cases/fastapi-login/fixture"
stems = ["login"]

# --- surfaces: one document, one screen ---

[[source.surface]]
entry = "ui-ir/login/behaviour.json"
stem = "login"

