# A commander CLI whose three commands are rows of one table in `src/cli.ts`,
# registered by one `for` loop — one `program.command(job.usage)…action(..)`
# call handing one function, so the parser sees one registration with no
# literal and names one surface under the receiver's type: the "wrong:
# merged" case. Each command is expected as its own surface at the table
# row that declares it, under the usage's first word, with the job module it
# names as what it reaches. Written before any run.

[[source]]
adapter = "typescript"
fixture = "evals/cases/cli-table/fixture"
stems = ["start", "import", "reconcile", "nightly"]

# --- surfaces: the bootstrap and the three table rows ---

[[source.surface]]
entry = "src/cli.ts"
stem = "start"

[[source.surface]]
entry = "src/cli.ts"
stem = "import"

[[source.surface]]
entry = "src/cli.ts"
stem = "reconcile"

[[source.surface]]
entry = "src/cli.ts"
stem = "nightly"

# --- start ---

[[requirement]]
stem = "start"
anchor = "src/cli.ts#L21-L32"
gloss = "Every row of JOBS is registered as a command with its usage, description, and a `--dry-run` option, and its exit code becomes the process's"

[[requirement]]
stem = "start"
anchor = "src/cli.ts#L34-L36"
gloss = "The database pool is closed after any command"

[[requirement]]
stem = "start"
anchor = "src/cli.ts#L38-L41"
gloss = "A command that throws is logged and exits 1"

