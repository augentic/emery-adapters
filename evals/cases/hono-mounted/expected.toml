# A Hono service whose bootstrap mounts three sub-applications by resource —
# `app.route("/orders", orders)`, `/customers`, `/health` — while each
# sub-application registers its routes at "/" and "/:id" relative to the
# mount. The resource is in the mount, which the parser's `mounts()` reads
# from `use` alone and `route()` never carries, so every route it names
# falls back to the receiver's type as its stem: the "wrong: stem" case. The
# bearer check under `/orders/*` and `/customers/*` is the bootstrap's.
# Written before any run.

