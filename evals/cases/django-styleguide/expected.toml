# HackSoftware/Django-Styleguide-Example at a70ef43d (MIT), vendored by the
# command in evals/README.md and gitignored: 128 production modules, ~115 KB,
# past the 64 KB the survey lays into one message, so the tree is cut one
# seam per stem — the `python` adapter's scale case. A Django project the
# way the styleguide writes one: `manage.py` under its guard names
# `config.django.base` by a string, the settings name `config.urls`, which
# includes the API's URL module under `api/` with the namespaced
# `include((module, namespace))` tuple, and that includes five applications
# under `auth/`, `users/`, `errors/`, `files/`, and `google-oauth2/` the same
# way; the settings are assembled from `config/settings/*` by star imports,
# two of them `setup.py` modules beneath a package. Each application
# registers class-based `APIView`s by `path(..)`, two of them with nested
# inline includes; `emails/tasks.py` and `tasks/tasks.py` declare
# `@shared_task`s, a blog example registers one through a wrapper of its own,
# and `tasks/management/commands/setup_periodic_tasks.py` is a management
# command; `custom_admin/sites.py` registers the two 2FA pages of an admin
# site the settings leave commented out, a registration the code spells all
# the same, as `fastapi-template`'s development-only router is. The admin
# modules, the testing examples, the Celery application module,
# `gunicorn.conf.py`, and the `markdown_tools/toc.py` script are reached by
# no surface. Written from the facts dump and the code before any run; the
# first baseline card named the 2FA pages on 3/3 and read four requirements
# as missed on 3/3 at code no surface reaches — `production.py`, which
# nothing imports; `create_superuser`, which only Django's own command
# calls; `email_send_all`, which only an admin action calls; `File.url`,
# which nothing reads — so the pages are expected and the four are gone.

adapter = "python"
fixture = "evals/cases/django-styleguide/fixture"
stems = ["start", "auth", "users", "errors", "files", "google-oauth2", "setup-2fa", "confirm-2fa", "email-send", "debug-task", "test-non-concurrent-task", "setup-periodic-tasks"]

# --- surfaces: the bootstrap, five applications' routes, the admin site's two pages, three tasks, one command ---

[[surface]]
entry = "manage.py"
stem = "start"

# session login and logout, JWT login and logout, `me/`, under `api/auth/`
[[surface]]
entry = "styleguide_example/authentication/urls.py"
stem = "auth"

# list, create, detail, update, under `api/users/`
[[surface]]
entry = "styleguide_example/users/urls.py"
stem = "users"

# three trigger routes under `api/errors/`
[[surface]]
entry = "styleguide_example/errors/urls.py"
stem = "errors"

# the standard upload and the three direct-upload routes under `api/files/`
[[surface]]
entry = "styleguide_example/files/urls.py"
stem = "files"

# the raw and the SDK flows' callback and redirect, under `api/google-oauth2/`
[[surface]]
entry = "styleguide_example/blog_examples/google_login_server_flow/raw/urls.py"
stem = "google-oauth2"

[[surface]]
entry = "styleguide_example/blog_examples/google_login_server_flow/sdk/urls.py"
stem = "google-oauth2"

# the admin site's `get_urls` registers `setup-2fa/` and `confirm-2fa/`, a
# route each under no mount, so each is a stem of its own
[[surface]]
entry = "styleguide_example/custom_admin/sites.py"
stem = "setup-2fa"

[[surface]]
entry = "styleguide_example/custom_admin/sites.py"
stem = "confirm-2fa"

[[surface]]
entry = "styleguide_example/emails/tasks.py"
stem = "email-send"

[[surface]]
entry = "styleguide_example/tasks/tasks.py"
stem = "debug-task"

# registered through the module's own `non_concurrent_task` wrapper, which
# hands `shared_task` the wrapped function: a task by the function's name
[[surface]]
entry = "styleguide_example/blog_examples/celery_non_concurrent/tasks.py"
stem = "test-non-concurrent-task"

[[surface]]
entry = "styleguide_example/tasks/management/commands/setup_periodic_tasks.py"
stem = "setup-periodic-tasks"

