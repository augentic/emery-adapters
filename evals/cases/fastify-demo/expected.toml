# fastify/demo at 5cd56012 (MIT), vendored by the command in evals/README.md
# and gitignored: a Fastify application of 34 production modules, ~45 KB,
# which fits one message. `src/server.ts` bootstraps and registers `src/app.ts`,
# which loads `plugins/external`, `plugins/app`, and `routes` through
# `@fastify/autoload` by directory — a computed load no resolver follows — and
# each route module registers its routes on the `fastify` instance its plugin
# function is handed, an untyped parameter typed only through the plugin's own
# type. The routes are real and registered; the parser's conventions see
# neither the load nor the receiver, which is the "wrong: missed" case. The
# four `scripts/*.ts` are operator commands the manifest's `db:*` scripts run
# — each guarded by its own `CAN_*` variable — expected one surface each under
# its module's stem; the parser reads only `start` and `dev` for entries, so it
# never names them. Written before any run, and amended once at the
# checkpoint, before the graded runs: the one route at the `/api` root
# (`src/routes/api/index.ts`) was first expected as no surface, its behaviour
# graded under no stem, because no path segment names its resource — an
# expectation the survey's own coverage gate cannot meet, since a module the
# facts list a live registration in is a surface or a finding and never
# unreached (the checkpoint run named it `index` once and exhausted the
# correction round over it once). The stem convention now gives such a route
# its module's or, for an `index`, its directory's name, so it is expected as
# one surface under `api`.

fixture = "evals/cases/fastify-demo/fixture"
stems = ["start", "home", "api", "auth", "users", "tasks", "create-database", "drop-database", "migrate", "seed-database"]

