# Experiment / non-production. The Full Stack FastAPI Template frontend's
# login page, the page `/` lands a visitor on before sign-in, as its
# rendered-layout facts (`page`, `rendered-layout`: a browser's capture
# across widths 320-1920 and heights 400-1440) beside an operator's inline
# brief (`brief`, an `intent` description) saying what to make of it. The
# frontend is the one at the commit the `fastapi-template` case reads
# `backend/` from. The facts carry no requirement: the source reads them by
# code alone into the regions, containers, and leaves of the design's
# `ui-layout` tree and hands the facts over whole as the design's one
# layout, so its stems are none. The brief's stem is a guess at what the
# intent turn names the page; the run reports what it named.
#
# The fixture is gitignored and captured before the case runs, with
# `tools/web-layout-capture/capture-site.sh fastapi-template`, as
# `evals/README.md`'s "Fetching vendored fixtures" says; without it the
# case is skipped.

[[source]]
name = "page"
adapter = "rendered-layout"
fixture = "evals/cases/fastapi-template-web/fixture"

[[source]]
name = "brief"
adapter = "intent"
description = "Rebuild the Full Stack FastAPI Template's login page exactly as its recorded layout shows it, at every recorded viewport width and height: every text, image, link, field, and button where the recording has it, nothing added and nothing left out. One page, with no behaviour beyond what the page shows."
stems = ["login"]
