# Five architecture decision records and an overview, each record a
# context, a decision, and its consequences. The decision-recall case:
# every record carries one `decision`, and its requirements are stated in
# the indicative ("A posted entry is immutable"), never with a modal. The
# overview is an index and no subject. One subject per record, stemmed by
# the noun the record is about and spells most.

