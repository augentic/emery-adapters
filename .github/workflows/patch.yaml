name: Create Patch

# Bump the patch version on a durable release-X.Y.Z line via the shared
# workflow (Cargo version + RELEASES.md).
#
# Dispatch from the release-* branch carrying the backported fix;
# Publish Release (dispatched from the same branch) tags, creates the
# GitHub Release, and publishes each component to GHCR.

on:
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: write

jobs:
  patch:
    uses: augentic/.github/.github/workflows/patch.yaml@main
    secrets: inherit
