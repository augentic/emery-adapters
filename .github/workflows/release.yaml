name: Release adapters

# Publish each adapter as a standard wasm-pkg package. Tagging `v<x.y.z>`
# cuts a release; each adapter's identity semver lives in its guest crate's
# `Cargo.toml` `version`, and the release-built component
# `target/wasm32-wasip2/release/<name>.wasm` is pushed as
# `specify:<name>@<semver>`.
#
# Publishing is idempotent: each identity is probed before pushing and
# skipped when already present. Auth is GITHUB_TOKEN alone.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.SPECIFY_REGISTRY || 'augentic.io' }}
  REGISTRY_NAMESPACE: specify
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  publish:
    name: Publish adapter components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: specify-adapters

      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: specify
          permission-contents: read

      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/specify".insteadOf \
            "https://github.com/augentic/specify"

      - name: Checkout specify
        uses: actions/checkout@v6
        with:
          repository: augentic/specify
          token: ${{ steps.app-token.outputs.token }}
          path: specify
          persist-credentials: false

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specify-adapters

      - name: Install cargo tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-nextest

      - name: Install wkg
        working-directory: specify-adapters
        run: cargo install wkg@0.15.0 --locked

      - name: Pre-publish workspace check
        working-directory: specify-adapters
        run: cargo make check

      - name: Release-build adapter components
        working-directory: specify-adapters
        run: cargo make release

      - name: Publish each adapter component
        working-directory: specify-adapters
        run: cargo make publish
