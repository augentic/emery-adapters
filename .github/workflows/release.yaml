name: Release adapters

# Publish each adapter as a standard wasm-pkg package (RFC-64: one
# component, no manifest). Tagging `v<x.y.z>` cuts a release; each
# adapter's identity semver lives in its guest crate's `Cargo.toml`
# `version` — the single identity declaration — and the release-built
# component `target/wasm32-wasip2/release/<name>.wasm` is pushed
# as `augentic:<name>@<semver>`. No tree pack, no adapter.yaml, no
# committed wasm.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Canonical first-party registry host. Must match the `augentic`
  # namespace mapping the engine resolves `augentic:<name>@<ver>`
  # references against. Override via repository variable for a mirror.
  REGISTRY: ${{ vars.SPECIFY_REGISTRY || 'augentic.io' }}
  REGISTRY_NAMESPACE: augentic

jobs:
  publish:
    name: Publish adapter components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout adapters
        uses: actions/checkout@v4

      # The stable toolchain is pinned by rust-toolchain.toml; nightly
      # rustfmt backs the `fmt-check` arm of the pre-publish gate below.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-nextest

      - name: Install wkg
        run: cargo install wkg --locked

      # Guard against publishing immutable artifacts from a broken tree:
      # fmt-check + clippy + nextest + doctests + doc (the lighter pre-commit
      # subset; vet/deny stay on the per-push CI gate).
      - name: Pre-publish workspace check
        run: cargo make check

      - name: Release-build every adapter component
        run: cargo make build-guests-release

      # `wkg publish` resolves the `augentic` namespace through this
      # config; credentials come from the registry secrets.
      - name: Write wkg config
        env:
          SPECIFY_REGISTRY_USERNAME: ${{ secrets.SPECIFY_REGISTRY_USERNAME }}
          SPECIFY_REGISTRY_PASSWORD: ${{ secrets.SPECIFY_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "${XDG_CONFIG_HOME:-$HOME/.config}/wasm-pkg"
          cat > "${XDG_CONFIG_HOME:-$HOME/.config}/wasm-pkg/config.toml" <<EOF
          [namespace_registries]
          ${REGISTRY_NAMESPACE} = "${REGISTRY}"

          [registry."${REGISTRY}".oci]
          auth = { username = "${SPECIFY_REGISTRY_USERNAME}", password = "${SPECIFY_REGISTRY_PASSWORD}" }
          EOF

      - name: Publish each adapter component
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          for dir in targets/*/ sources/*/; do
            name="$(basename "${dir}")"
            pkg="$(sed -n 's/^name = "\(.*\)"/\1/p' "${dir}Cargo.toml" | head -1)"
            version="$(jq -r --arg n "${pkg}" \
              '.packages[] | select(.name == $n) | .version' <<< "${metadata}")"
            if [ -z "${version}" ] || [ "${version}" = "null" ]; then
              echo "::error::no ${pkg} package version in cargo metadata"; exit 1
            fi
            artifact="target/wasm32-wasip2/release/${name}.wasm"
            if [ ! -s "${artifact}" ]; then
              echo "::error::missing release component ${artifact}"; exit 1
            fi
            package="${REGISTRY_NAMESPACE}:${name}@${version}"
            echo "::group::${package}"
            wkg publish "${artifact}" --package "${package}"
            echo "::endgroup::"
          done
