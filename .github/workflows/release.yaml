name: Release adapters

# Publish each adapter as a standard wasm-pkg package. Tagging `v<x.y.z>`
# cuts a release; each adapter's identity semver lives in its guest crate's
# `Cargo.toml` `version`, and the release-built component
# `target/wasm32-wasip2/release/<name>.wasm` is pushed as
# `specify:<name>@<semver>`.
#
# Publishing is idempotent: each identity is probed before pushing and
# skipped when already present. Auth is GITHUB_TOKEN alone.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ${{ vars.SPECIFY_REGISTRY || 'augentic.io' }}
  REGISTRY_NAMESPACE: specify

jobs:
  publish:
    name: Publish adapter components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout adapters
        uses: actions/checkout@v4

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src, rustfmt
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-nextest

      - name: Install wkg
        run: cargo install wkg@0.15.0 --locked

      - name: Pre-publish workspace check
        run: cargo make check

      - name: Release-build adapter components
        run: cargo make release

      - name: Publish each adapter component
        run: cargo make publish
