name: Create Release

# Cut a durable release-X.Y.Z line for the first-party adapter train via the
# shared Omnia-shaped workflow: push release-<version> at the current main
# tip, then open a PR that bumps main to the next unreleased train version
# and resets RELEASES.md. GHCR publication runs in Publish Release.

on:
  workflow_dispatch:
    inputs:
      # N.B Cargo version rules allow "minor" for breaking changes while on 0.x.y
      increment:
        description: The type of version bump to perform
        default: minor
        type: string

concurrency:
  group: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: augentic/.github/.github/workflows/release.yaml@main
    with:
      increment: ${{ inputs.increment }}
    secrets: inherit
