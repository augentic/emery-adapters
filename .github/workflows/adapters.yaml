name: Publish adapters

# First-party Wasm OCI packages for GHCR. Called from publish.yaml after
# the shared publish workflow has tagged and created the GitHub Release.
# Uses the same `cargo make release` / `cargo make publish` path as a
# local maintainer (RFC-76 Phase E).

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm32-wasip2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build components
        run: cargo make release

      - name: Publish components
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in sources/*/ targets/*/; do
            name="$(basename "$dir")"
            cargo make publish "$name"
          done
