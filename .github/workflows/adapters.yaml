name: Publish adapters

# First-party Wasm OCI packages for GHCR. Called from publish.yaml after
# the shared publish workflow has tagged and created the GitHub Release.
# Uses the same `cargo make release` / `cargo make publish` path as a
# local maintainer (RFC-76 Phase E).

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always
  # Cargo's libgit2 fetcher does not see the app-token git credentials.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: specify-adapters

      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: specify
          permission-contents: read

      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/specify".insteadOf \
            "https://github.com/augentic/specify"

      - name: Checkout specify
        uses: actions/checkout@v6
        with:
          repository: augentic/specify
          token: ${{ steps.app-token.outputs.token }}
          path: specify
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: specify-adapters
          key: release-wasm32-wasip2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build components
        working-directory: specify-adapters
        run: cargo make release

      - name: Publish components
        working-directory: specify-adapters
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in sources/*/ targets/*/; do
            name="$(basename "$dir")"
            cargo make publish "$name"
          done
