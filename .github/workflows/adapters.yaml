name: Publish adapters

# First-party Wasm OCI packages for GHCR. Called from publish.yaml after
# the shared publish workflow has tagged and created the GitHub Release.
# Uses the same cargo / wkg commands as `make release` / `make publish`
# locally (RFC-76 Phase E).

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-wasm32-wasip2

      - uses: taiki-e/install-action@v2
        with:
          tool: wkg

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build components
        run: cargo build --workspace --exclude eval --target wasm32-wasip2 --release

      - name: Publish components
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          for dir in sources/*/; do
            name="$(basename "$dir")"
            wkg oci push "ghcr.io/augentic/emery-adapters/$name:$version" "target/wasm32-wasip2/release/$name.wasm"
          done
