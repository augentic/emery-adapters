name: Publish Release

# Publish a durable release-X.Y.Z line of the first-party adapter train:
# dispatch from the release branch. Gates on the shared CI workflow, then the
# shared publish workflow dates RELEASES.md, tags vX.Y.Z, and creates the
# GitHub Release; adapters.yaml then release-builds and pushes each
# component to GHCR (same cargo / wkg commands as `make release` /
# `make publish` locally).

on:
  workflow_dispatch:

concurrency:
  group: publish

permissions:
  contents: read

jobs:
  skip:
    name: Skipped
    if: ${{ !startsWith(github.ref_name, 'release-') }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow only runs on the 'release-*' branches"
          exit 1

  ci:
    name: CI
    if: ${{ startsWith(github.ref_name, 'release-') }}
    uses: augentic/.github/.github/workflows/ci.yaml@main
    secrets: inherit

  publish:
    name: Publish
    needs: ci
    permissions:
      contents: write
    uses: augentic/.github/.github/workflows/publish.yaml@main

  adapters:
    name: Publish adapters
    needs: publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/adapters.yaml
    secrets: inherit
