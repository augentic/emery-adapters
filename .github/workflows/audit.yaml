name: Audit

# Daily advisory-DB audit of the adapters Cargo workspace at the repo root.
# Advisory findings are surfaced here rather than on the per-push CI gate so a
# fresh upstream advisory never blocks an unrelated change.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: specify-adapters

      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: specify
          permission-contents: read

      - name: Checkout specify
        uses: actions/checkout@v6
        with:
          repository: augentic/specify
          token: ${{ steps.app-token.outputs.token }}
          path: specify
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        working-directory: specify-adapters
        run: cargo audit
