name: Audit

# Daily advisory-DB audit of the adapters Cargo workspace at the repo root.
# Advisory findings are surfaced here rather than on the per-push CI gate so a
# fresh upstream advisory never blocks an unrelated change.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: specify-adapters

      - name: Private Git access
        uses: ./specify-adapters/.github/actions/checkout-with-specify
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        working-directory: specify-adapters
        run: cargo audit
