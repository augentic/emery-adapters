name: Audit

# Daily advisory-DB audit of the adapters Cargo workspace at the repo root.
# Advisory findings are surfaced here rather than on the per-push CI gate so a
# fresh upstream advisory never blocks an unrelated change.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters

      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read

      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/emery".insteadOf \
            "https://github.com/augentic/emery"

      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        working-directory: emery-adapters
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: cargo audit
