name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The extension crates + the forked shared/ crate. Mirrors the lean
  # carve-out posture the tools had in the platform repo's wasi-tools/
  # workspace before extraction (RFC-48 D10).
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # RFC-49 T5: the only remaining cross-repo seam. Build the platform
  # `specify` binary (branch-matched, falling back to main) and lint the
  # adapter manifests + briefs against the platform contract.
  framework-lint:
    name: framework-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout adapters
        uses: actions/checkout@v4

      - name: Resolve platform ref
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          if git ls-remote --exit-code --heads \
            https://github.com/augentic/specify "${branch}" >/dev/null 2>&1; then
            echo "ref=${branch}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=main" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout platform binary source
        uses: actions/checkout@v4
        with:
          repository: augentic/specify
          ref: ${{ steps.platform.outputs.ref }}
          path: .platform

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .platform/engine

      - name: Build specify
        working-directory: .platform/engine
        run: cargo build --release -p specify --locked

      - name: Lint adapters against the platform contract
        run: .platform/engine/target/release/specify lint framework --framework-root .

      - name: adapter build smoke (C1 regression guard)
        run: |
          .platform/engine/target/release/specify adapter build --path adapters/targets/contracts --dry-run
          .platform/engine/target/release/specify adapter build --path adapters/targets/vectis --dry-run
