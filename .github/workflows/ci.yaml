name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two adapter extension crates (contracts + vectis). Full Rust
  # workspace gate via `cargo make ci`, matching the platform engine's
  # toolchain posture (RFC-48 D10).
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Full-parallelism nextest profile; local runs keep the bounded
      # default so macOS does not choke on the integration subprocesses.
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      # The stable toolchain is pinned by rust-toolchain.toml; nightly
      # rustfmt is additionally needed for the `fmt-check` gate, which runs
      # `cargo +nightly fmt --all -- --check`.
      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rust-src, rustfmt
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make,cargo-nextest,cargo-deny,cargo-vet

      # Full Rust workspace gate: fmt-check, clippy, nextest, doctests,
      # doc, vet, deny.
      - name: Rust workspace CI
        run: cargo make ci

  # RFC-49 T5: the only remaining cross-repo seam. Build the platform
  # `specify` binary (branch-matched, falling back to main) and lint the
  # adapter manifests + briefs against the platform contract.
  framework-lint:
    name: framework-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout adapters
        uses: actions/checkout@v4

      - name: Resolve platform ref
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-main}}"
          if git ls-remote --exit-code --heads \
            https://github.com/augentic/specify "${branch}" >/dev/null 2>&1; then
            echo "ref=${branch}" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=main" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout platform binary source
        uses: actions/checkout@v4
        with:
          repository: augentic/specify
          ref: ${{ steps.platform.outputs.ref }}
          path: .platform

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .platform/engine

      - name: Build specify
        working-directory: .platform/engine
        run: cargo build --release -p specify --locked

      - name: Lint adapters against the platform contract
        run: .platform/engine/target/release/specify lint framework --framework-root .

      - name: adapter build smoke (C1 regression guard)
        run: |
          .platform/engine/target/release/specify adapter build --path adapters/targets/contracts --dry-run
          .platform/engine/target/release/specify adapter build --path adapters/targets/vectis --dry-run
