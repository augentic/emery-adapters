name: CI

on:
  push:

permissions:
  contents: read

jobs:
  ci:
    uses: augentic/.github/.github/workflows/ci.yaml@v0.2.0
    secrets: inherit
    with:
      # wasm32 clippy over every lib, bin and example of the guest side: the
      # `sources/*` adapters and the `test-programs` guest programs. The root
      # package and the `evals` harness are native — the suites and the
      # runner name host-only dependencies — so the pass is scoped to the
      # guest packages; mirrors `WASM32_PACKAGES` in mise.toml, and a new
      # adapter is named in both.
      targets: wasm32-wasip2
      wasm-packages: documentation intent python typescript test-programs
