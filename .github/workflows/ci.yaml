name: CI

on:
  push:
  # Reused as the gate in publish.yaml (Publish Release dispatches on a
  # release-* branch and needs the full per-push suite green first).
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always
  # Cargo's libgit2 fetcher does not see the app-token checkout credentials.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters
      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read
      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/emery".insteadOf \
            "https://github.com/augentic/emery"
      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emery-adapters
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        working-directory: emery-adapters

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters
      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read
      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/emery".insteadOf \
            "https://github.com/augentic/emery"
      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emery-adapters
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --locked --tests --all-features --no-tests=pass
        working-directory: emery-adapters

  test-doc:
    name: Test docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters
      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read
      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/emery".insteadOf \
            "https://github.com/augentic/emery"
      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emery-adapters
      - id: lib
        working-directory: emery-adapters
        run: |
          has_lib=$(cargo metadata --format-version 1 --no-deps \
            | jq '[.packages[].targets[].kind[]
                   | select(IN("lib","rlib","cdylib","dylib","staticlib","proc-macro"))]
                   | length > 0')
          echo "exists=$has_lib" >> "$GITHUB_OUTPUT"
      - if: steps.lib.outputs.exists == 'true'
        working-directory: emery-adapters
        run: cargo test --doc --locked --all-features --workspace

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters
      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read
      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/emery".insteadOf \
            "https://github.com/augentic/emery"
      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emery-adapters
      - run: cargo doc --no-deps --workspace --all-features --locked
        working-directory: emery-adapters

  vet:
    name: Vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters
      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read
      - name: Authenticate Cargo git deps
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/augentic/emery".insteadOf \
            "https://github.com/augentic/emery"
      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: emery-adapters
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked
        working-directory: emery-adapters

  deny:
    name: Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: emery-adapters
      - name: Private Git access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: augentic
          repositories: emery
          permission-contents: read
      - name: Checkout emery
        uses: actions/checkout@v6
        with:
          repository: augentic/emery
          token: ${{ steps.app-token.outputs.token }}
          path: emery
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: emery-adapters/Cargo.toml
          arguments: --workspace --locked
          use-git-cli: true
          # Full URL form required by cargo-deny-action's credential.helper store.
          credentials: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com
