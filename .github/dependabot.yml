version: 2
updates:
  # The parsers each adapter pins exactly while they are pre-1.0 — ruff's
  # crates ship weekly, oxc's often — and nothing else: `make check` surfaces
  # the rest through `cargo outdated`. Each parser's crates bump as one group,
  # so a bump is deliberate and the component suite runs over all of them at
  # one version.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "ruff_python_parser"
      - dependency-name: "ruff_python_ast"
      - dependency-name: "ruff_text_size"
      - dependency-name: "oxc_*"
    groups:
      ruff:
        patterns:
          - "ruff_*"
      oxc:
        patterns:
          - "oxc_*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # The toolkit pin is Renovate's: one pull request over every `uses:`
      # and the mise `?ref=` together (renovate.json).
      - dependency-name: "augentic/*"
