[package]
name = "omnia-core"
description = "Wasm-free core of the omnia target adapter: embedded prose registry and the guidance / build / merge judgment operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
adapter.workspace = true

[build-dependencies]
prose.workspace = true

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true
