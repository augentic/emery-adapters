[package]
name = "specify-omnia"
description = "Omnia target-adapter WASI guest component: wasm32 shim over specify-omnia-core"
# The adapter identity version (RFC-64): the semver the component
# publishes under as `augentic:<name>@<version>` — declared once, here.
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Guest-only: the component body compiles solely for wasm32, so its
# dependencies live under the same target gate omnia's guests use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
specify-omnia-core = { path = "core" }
specify-guest-kit.workspace = true
wasip3.workspace = true

[lints]
workspace = true
