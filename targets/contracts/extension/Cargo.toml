[package]
name = "specify-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Standalone validator for the contracts adapter — SemVer + info.x-specify-id + cross-project uniqueness checks"
categories = ["development-tools", "command-line-utilities"]
keywords = ["specify", "contracts", "validate", "openapi", "asyncapi"]

# Legacy host binary — the contracts gate now runs the in-guest validator in
# `specify-contracts-core`; this shim stays available for parity tests and
# direct local debugging until RFC-61 Step 5 Milestone A2 deletes the crate.
[[bin]]
name = "specify-contract"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
specify-contracts-core.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
