# yaml-language-server: $schema=https://github.com/augentic/specify/raw/main/schemas/target.schema.json
name: vectis
version: "1.0.4"
axis: target
description: Vectis target adapter — Crux shared core (Rust), SwiftUI iOS shell, and Kotlin/Jetpack Compose Android shell. `guidance` carries the Crux idiom guidance core synthesis folds into `spec.md` and `design.md`; `build` regenerates the per-slice `composition.yaml` alongside the implementation code; `merge` lands both and re-runs the host cap matrix against the merged baseline. `tokens.yaml` and `assets.yaml` remain operator-curated build inputs.
platforms:
  required: true
  allowed: [core, ios, android, web, desktop]
  default: [core, ios, android]
