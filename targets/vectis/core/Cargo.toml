[package]
name = "vectis-core"
description = "Wasm-free core of the vectis target adapter: embedded prose registry, the absorbed validate / materialize / prepare / verify / infer / scaffold libraries, and the guidance / build / merge judgment operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
image.workspace = true
jsonschema.workspace = true
resvg.workspace = true
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
adapter.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
toml.workspace = true
usvg.workspace = true

[build-dependencies]
jsonschema.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
prose.workspace = true

[dev-dependencies]
tempfile.workspace = true
testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
