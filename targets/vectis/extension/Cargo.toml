[package]
name = "specify-vectis-extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "WASI command tool for Vectis (validate + scaffold)"
categories = ["development-tools", "command-line-utilities", "wasm"]
keywords = ["specify", "vectis", "wasi"]

# The lib target keeps the historical `specify_vectis` crate name so the
# integration tests' imports stay stable; the package rename to
# `specify-vectis-extension` (RFC-61 Step 3) freed the `specify-vectis`
# package name for the adapter guest. The shipped artifact is the
# `vectis` binary either way.
[lib]
name = "specify_vectis"
path = "src/lib.rs"

[[bin]]
name = "vectis"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
clap.workspace = true
serde_json.workspace = true
specify-vectis-core.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
image.workspace = true
tempfile.workspace = true
