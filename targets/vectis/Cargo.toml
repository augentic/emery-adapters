[package]
name = "specify-vectis"
description = "Vectis target-adapter WASI guest component: wasm32 shim over specify-vectis-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The lib target is named apart from the package because the legacy
# extension crate (`specify-vectis-extension`, deleted at RFC-61 Step 5)
# keeps the `specify_vectis` lib name its integration tests import;
# two same-named lib targets would collide in `cargo doc --workspace`.
# The built component is `specify_vectis_adapter.wasm`.
[lib]
name = "specify_vectis_adapter"
crate-type = ["cdylib"]

# Guest-only: the component body compiles solely for wasm32, so its
# dependencies live under the same target gate omnia's guests use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
specify-vectis-core.workspace = true
specify-guest-kit.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
