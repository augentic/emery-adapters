# Composed-deployment conformance: the built adapter components hosted on
# the Omnia runtime, model-free. Proves the surface no native suite can —
# WIT bindings, host-mediated dispatch-by-id, and mount/route wiring.
[package]
name = "composed"
description = "Composed-deployment WASM/WIT conformance tests over the built adapter components"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Flattened like omnia's examples: the support lib and the test target sit
# beside the manifest.
[lib]
path = "support.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia.workspace = true
omnia-testkit.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "composed"
path = "composed.rs"

[lints]
workspace = true
