# https://embarkstudios.github.io/cargo-deny

[graph]
all-features = true

targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "wasm32-wasip2",
]

[output]
feature-depth = 1

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[licenses.private]
ignore = true

[bans]
deny = []
multiple-versions = "allow"
skip = []
skip-tree = []
wildcards = "allow"

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "warn"

[sources]
allow-git = [
  "https://github.com/augentic/emery.git",
  "https://github.com/augentic/omnia-exemplar.git",
  "https://github.com/augentic/omnia.git",
]
