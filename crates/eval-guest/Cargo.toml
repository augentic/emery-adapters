[package]
name = "specify-eval-guest"
description = "Eval-driver WASI guest: drives one target-adapter build through host-mediated dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Guest-only: the component body compiles solely for wasm32, so its
# dependencies live under the same target gate omnia's guests use.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[lints]
workspace = true
