# Routing for the `contracts/update` scenario: the adapter under test, the seam
# operation `cargo make eval scenario` drives, and the slice name.
adapter = "target:contracts"
operation = "build"
slice = "loyalty-api-contract"

# Deterministic artifact-exists gate: a success report must leave the
# slice contracts delta non-empty.
expect = [".specify/slices/loyalty-api-contract/contracts"]
