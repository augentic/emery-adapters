[package]
name = "adapter"
description = "Shared guest support for Specify adapter components: the local Model capability trait and the shared judgment scaffolding"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[features]
# Dev-only prose overlay: body lookups consult `.eval/prose/<path>` before
# the embedded table. Never enabled by the release guest builds.
prose-overlay = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# The WASI-backed default body of `Model::create`, the MCP reference
# shelf, and the `specify:adapter` world bindings compile only for the
# wasm32 guest target, mirroring omnia-guest's capability traits.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

# The dev-dependency cycle back through `testkit` is deliberate and
# cargo-legal: dev-deps are only built for tests, never for the guest.
[dev-dependencies]
tempfile.workspace = true
testkit.workspace = true
tokio.workspace = true

[lints]
workspace = true
