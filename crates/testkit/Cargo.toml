# Dev-only test support for the adapter suites (publish = false):
# local copies of the request-recording model harness and grant
# inspection that pair with omnia-testkit's `Scripted` double, pending
# their move upstream to `omnia_testkit::model` (upstream owns generic
# mechanics; recording assertions live with their consumers). Delete
# this crate once the omnia-testkit pin carries `Harness`/`mcp_grants`.
[package]
name = "testkit"
description = "Dev-only test support for Specify adapter suites"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
omnia-guest.workspace = true
omnia-testkit.workspace = true

[lints]
workspace = true
