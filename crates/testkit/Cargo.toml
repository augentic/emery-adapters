[package]
name = "testkit"
description = "Test doubles for the adapter-core suites: the scripted MockModel judgment provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

# Dev-dependency-only: the testkit never compiles for the guest wasm32
# targets, so its dependencies live under the same target gate the
# harness uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
adapter.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
