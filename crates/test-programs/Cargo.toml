[package]
name = "test-programs"
description = "Guest scenario programs driven by the seam suites, and the compiled artifacts they run — the shipped adapters among them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[lints]
workspace = true

# The guest side: `build.rs` (through `omnia_test::build`) compiles every
# `programs/<group>/<scenario>.rs` as an `[[example]]` cdylib for
# `wasm32-wasip2`, beside every `sources/*` adapter component. The native side
# has no dependencies: it is the generated artifact paths alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
emery-adapter.workspace = true
emery-prose.workspace = true
emery-sdk.workspace = true
omnia-guest.workspace = true
semver.workspace = true
serde_json.workspace = true
wasip3.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Generated by build.rs from programs/<group>/<scenario>.rs.

[[example]]
name = "probe_echo"
path = "programs/probe/echo.rs"
crate-type = ["cdylib"]

[[example]]
name = "probe_gated"
path = "programs/probe/gated.rs"
crate-type = ["cdylib"]

[[example]]
name = "probe_refusing"
path = "programs/probe/refusing.rs"
crate-type = ["cdylib"]

[[example]]
name = "probe_upstream"
path = "programs/probe/upstream.rs"
crate-type = ["cdylib"]

[[example]]
name = "source_extract"
path = "programs/source/extract.rs"
crate-type = ["cdylib"]
