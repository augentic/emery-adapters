[package]
name = "specify-guest-kit"
description = "Shared guest support for Specify adapter components: the local Model capability trait and its mock provider"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

# The WASI-backed default body of `Model::create`, the MCP reference
# shelf, and the `augentic:specify` world bindings compile only for the
# wasm32 guest target, mirroring omnia-guest's capability traits.
[target.'cfg(target_arch = "wasm32")'.dependencies]
omnia-guest.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
