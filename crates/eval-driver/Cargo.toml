[package]
name = "specify-eval-driver"
description = "Omnia runtime! host binary driving adapter-guest evals against the live cursor backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The target guard in main.rs needs cfg-if on every target; a stray
# wasm32 build of the whole workspace then compiles to an empty main.
[dependencies]
cfg-if.workspace = true

# Host-only: the driver binary never compiles for the guest wasm32 targets,
# so its dependencies live under the same target gate omnia itself uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
omnia.workspace = true
omnia-cursor.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
