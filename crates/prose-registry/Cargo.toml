[package]
name = "specify-prose-registry"
description = "Build-time codegen for adapter guests' embedded prose registries: walks an adapter's prose trees and emits the sorted include_str! doc table"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
# Integration tests compile to the single `it` binary (one binary per
# crate); the per-area files are pulled in via tests/it.rs `#[path]`
# includes.
autotests = false

[[test]]
name = "it"
path = "tests/it.rs"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
