[package]
name = "emery-omnia"
description = "Omnia target-adapter"

version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
emery-sdk.workspace = true
omnia-template.workspace = true
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
