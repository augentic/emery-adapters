# Per-adapter src unit-test high-water marks for the ratchet gate enforced
# by `unit_test_budget_holds` in tests/rust_quality.rs. Mirrors the engine
# gate (augentic/specify engine/tests/rust_quality_budget.toml).
#
# Keys are adapter directory names (the segment after targets/ or sources/).
# The committed number must EQUAL the live count of `#[test]` /
# `#[tokio::test]` declarations under that adapter's src/ trees (the guest
# shim and its core/src/ sub-crate):
#
#   - Above budget fails the gate: do not add src unit tests. Exercise the
#     behavior through the public surface in the crate's tests/ tree.
#   - Below budget fails the gate: a reduction landed; lower the number to
#     lock it in. The ratchet only moves down.
#
# Adapters absent from this table have an implicit budget of 0. See
# TESTING.md. Every adapter sits at zero: RFC-61 Step 5 Milestone A1 moved
# the last 14 vectis extension unit tests into
# `targets/vectis/core/tests/`, so the table is empty.
[adapter]
