[package]
name = "adapter-tests"
description = "Composed-deployment tests hosting the adapter guest components on the Omnia runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Host-only: the composed tests never compile for the guest wasm32 targets,
# so their dependencies live under the same target gate omnia itself uses.
# The package's lib (`src/lib.rs`) is the shared harness the per-area test
# binaries link, so the deps are ordinary (not dev-) dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
harness.workspace = true
omnia.workspace = true
omnia-testkit.workspace = true
omnia-wasi-http.workspace = true
omnia-wasi-model.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
