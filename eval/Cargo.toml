# The adapters wrapper over the engine-owned `specify/crates/harness`:
# `specify-dev/` links the first-party adapter crates, declares the
# harness catalog binding, and carries the repository's trial profile,
# deterministic grading, and prompt-scenario data. All generic plumbing
# (catalog machinery, seam provider, model bridge, telemetry, trial and
# scenario drivers, command/HTTP transports) lives in the shared
# `harness` crate pinned below.
#
# Standalone workspace, deliberately excluded from the adapters root: the
# engine crates below are a revision-pinned private git dependency, and
# keeping them out of the root graph means ordinary adapter commands never
# resolve or authenticate to Specify. The pin is this harness's declared
# compatibility target — it advances deliberately, not with every engine
# commit. Sibling co-development overrides it with hand-supplied
# `--config` path patches; never commit them.
[workspace]
resolver = "3"
members = ["specify-dev"]

[workspace.package]
version = "0.1.0"
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/specify-adapters"
rust-version = "1.95"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
axum = "0.8.9"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "sync"] }

# The engine pin: the Specify revision this wrapper is verified against
# (the shared `harness` crate and the engine crates it re-exposes). The
# wasm change example consumes the matching published core component;
# advance SPECIFY_CORE_VERSION in the root Makefile.toml with this rev.
artifacts = { git = "https://github.com/augentic/specify.git", rev = "46e93f1ae58d066430f73fd68bab5f0bd5120620" }
change = { git = "https://github.com/augentic/specify.git", rev = "46e93f1ae58d066430f73fd68bab5f0bd5120620" }
harness = { git = "https://github.com/augentic/specify.git", rev = "46e93f1ae58d066430f73fd68bab5f0bd5120620" }
project = { git = "https://github.com/augentic/specify.git", rev = "46e93f1ae58d066430f73fd68bab5f0bd5120620" }

omnia-guest = "0.35.0"

# The linked first-party adapter crates — `specify-dev` only.
captures = { path = "../sources/captures" }
contracts = { path = "../targets/contracts" }
documentation = { path = "../sources/documentation" }
intent = { path = "../sources/intent" }
omnia-target = { package = "omnia", path = "../targets/omnia" }
screenshots = { path = "../sources/screenshots" }
typescript = { path = "../sources/typescript" }
vectis = { path = "../targets/vectis" }

omnia-testkit = "0.35.0"
tempfile = "3"
tower = "0.5.3"

[patch.crates-io]
omnia = { git = "https://github.com/augentic/omnia.git" }
omnia-cursor = { git = "https://github.com/augentic/backends.git" }
omnia-guest = { git = "https://github.com/augentic/omnia.git" }
omnia-testkit = { git = "https://github.com/augentic/omnia.git" }
omnia-wasi-http = { git = "https://github.com/augentic/omnia.git" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia.git" }

wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

# Same lint bar as the adapters root, restated because a standalone
# workspace cannot inherit another workspace's tables.
[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

multiple_crate_versions = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = true
opt-level = 2
strip = true
