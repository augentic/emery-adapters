# The reusable, adapter-agnostic eval harness core: the linked-adapter
# catalog machinery over the per-axis operations traits, the native seam
# provider, the guest-side model bridge, telemetry, MCP shelves, and
# trial plumbing. Carries no dependency on any concrete adapter crate —
# the invariant that lets this crate move to `specify/crates/harness`
# unchanged (the engine's eval wrapper instantiates the catalog with the
# testkit fixture; `specify-dev` instantiates it with the first-party
# adapters).
