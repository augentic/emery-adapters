# Native-only adapter binding. Runtime and trial policy live in
# `harness`; this package declares only its linked adapters.
[package]
name = "engine"
description = "Specify adapters' native dev shim and live-model evaluation harness"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "engine"
path = "src/main.rs"

[lib]
name = "eval_binding"
path = "src/lib.rs"

[dependencies]
harness.workspace = true

captures.workspace = true
contracts.workspace = true
documentation.workspace = true
intent.workspace = true
omnia-target.workspace = true
screenshots.workspace = true
typescript.workspace = true
vectis.workspace = true

[lints]
workspace = true
