# The `specify-dev` wrapper: links the first-party adapter crates,
# declares the harness catalog, and carries the live-model trial,
# deterministic grading, and single-operation prompt scenarios. The
# binary drives the same verb handlers as the wasm guest against the
# harness's native provider.
