[workspace]
members = ["composed", "examples/change", "crates/*", "sources/*", "targets/*"]
# The eval harness is a standalone workspace: it consumes Specify's engine
# crates from a revision-pinned git source, and keeping it excluded means
# ordinary adapter metadata/test/lint/vet commands never resolve (or
# authenticate to) that private dependency.
exclude = ["eval"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/specify-adapters"
rust-version = "1.95"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
cfg-if = "1.0.4"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
jsonschema = { version = "0.47.0", default-features = false }
resvg = { version = "0.47.0", default-features = false }
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1.0.150"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2"
tiny-skia = { version = "0.12.0", default-features = false }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
toml = "1.1.3"
usvg = { version = "0.47", default-features = false }

omnia = "0.35.0"
omnia-cursor = "0.28.0"
omnia-guest = "0.35.0"
omnia-testkit = "0.35.0"
omnia-wasi-http = "0.35.0"
omnia-wasi-model = "0.35.0"

# The canonical adapter SDK, owned by the engine (RFC-61). The pin is
# this repository's declared, verified engine revision; it advances
# deliberately with the eval workspace's engine pin. Sibling
# co-development overrides it with hand-supplied `--config` path
# patches; never commit them.
adapter = { git = "https://github.com/augentic/specify.git", rev = "46e93f1ae58d066430f73fd68bab5f0bd5120620" }
prose = { path = "crates/prose" }
testkit = { path = "crates/testkit" }

[patch.crates-io]
omnia = { git = "https://github.com/augentic/omnia.git" }
omnia-cursor = { git = "https://github.com/augentic/backends.git" }
omnia-guest = { git = "https://github.com/augentic/omnia.git" }
omnia-testkit = { git = "https://github.com/augentic/omnia.git" }
omnia-wasi-http = { git = "https://github.com/augentic/omnia.git" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia.git" }

# omnia = { path = "../omnia/crates/omnia" }
# omnia-cursor = { path = "../backends/crates/cursor" }
# omnia-guest = { path = "../omnia/crates/omnia-guest" }
# omnia-testkit = { path = "../omnia/crates/testkit" }
# omnia-wasi-http = { path = "../omnia/crates/wasi-http" }
# omnia-wasi-model = { path = "../omnia/crates/wasi-model" }

wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
# Groups carry priority = -1 so individual lints below can override them.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The `cargo` group's `multiple_crate_versions` lint is the wrong signal in a
# workspace this size: transitive duplicates accrete from upstream crates we do
# not control (the resvg / usvg / image rasterisation graph), and a ratchet
# allowlist only ever grows. A periodic `cargo tree --duplicates` audit is the
# cheaper signal.
multiple_crate_versions = "allow"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = true
opt-level = 2
strip = true
