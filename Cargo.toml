[package]
name = "emery-adapters"
description = "The host side of the adapter workspace: the component and corpus suites over every shipped component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
documentation = { path = "sources/documentation" }
emery-sdk.workspace = true
intent = { path = "sources/intent" }
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
opentelemetry-proto.workspace = true
serde_json.workspace = true
test-programs.workspace = true
tokio.workspace = true
tracing.workspace = true
typescript = { path = "sources/typescript" }

[lints]
workspace = true

[workspace]
members = ["crates/*", "sources/*"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery-adapters"
rust-version = "1.98"
version = "0.13.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
opentelemetry-proto = "0.33.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
wasip3 = "0.9.0"

omnia = { version = "0.37.0", default-features = false, features = ["jit", "otlp"] }
omnia-sdk = { version = "0.37.0", default-features = false }
omnia-test = { version = "0.37.0", default-features = false }
omnia-wasi-model = "0.37.0"
omnia-wasi-otel = "0.37.0"

emery-prose = "0.38.0"
emery-sdk = "0.38.0"
test-programs = { path = "crates/test-programs" }

[patch.crates-io]
emery-prose = { git = "https://github.com/augentic/emery" }
emery-sdk = { git = "https://github.com/augentic/emery" }
# emery-prose = { path = "../emery/crates/prose" }
# emery-sdk = { path = "../emery/crates/sdk" }

omnia = { git = "https://github.com/augentic/omnia" }
omnia-sdk = { git = "https://github.com/augentic/omnia" }
omnia-test = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
# omnia = { path = "../omnia/crates/omnia" }
# omnia-sdk = { path = "../omnia/crates/omnia-sdk" }
# omnia-test = { path = "../omnia/crates/omnia-test" }
# omnia-wasi-model = { path = "../omnia/crates/wasi-model" }
# omnia-wasi-otel = { path = "../omnia/crates/wasi-otel" }

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = { level = "warn", priority = -1 }      # correctness, suspicious, style, complexity, perf
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html

# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Recommended-but-skipped restriction lints with rationale:
# - `tests_outside_test_module`: fires on every integration test in `tests/*.rs`
# - `str_to_string`: opinionated against `.to_string()` on `&str`;
# - `field_scoped_visibility_modifiers`

[profile.release]
lto = true
opt-level = 2
strip = true

# Optimise the JIT in debug builds: the component suites run every component
# through Cranelift at test time, and unoptimised codegen is ~10x slower.
# Dependencies keep line tables only (workspace crates are unaffected):
# wasmtime and Cranelift with full debuginfo dominate `target/`.
[profile.dev.package]
"*" = { debug = "line-tables-only" }
cranelift-assembler-x64 = { opt-level = 2 }
cranelift-bforest = { opt-level = 2 }
cranelift-bitset = { opt-level = 2 }
cranelift-codegen = { opt-level = 2 }
cranelift-control = { opt-level = 2 }
cranelift-entity = { opt-level = 2 }
cranelift-frontend = { opt-level = 2 }
cranelift-native = { opt-level = 2 }
regalloc2 = { opt-level = 2 }
wasmparser = { opt-level = 2 }
wasmtime-environ = { opt-level = 2 }
wasmtime-internal-cranelift = { opt-level = 2 }
