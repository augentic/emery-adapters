[workspace]
resolver = "3"
members = [
    "crates/*",
    "evals",
    "sources/*",
    "sources/*/core",
    "targets/*",
    "targets/*/core",
    "tests",
]

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/specify-adapters"
rust-version = "1.95"
version = "0.4.3"
publish = false

[workspace.dependencies]
anyhow = "1"
cfg-if = "1"
jsonschema = { version = "0.46", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.26"
serde_json = "1"
sha2 = "0.11"
adapter = { path = "crates/adapter" }
adapter-tests = { path = "tests" }
prose = { path = "crates/prose" }
contracts-core = { path = "targets/contracts/core" }
vectis-core = { path = "targets/vectis/core" }
thiserror = "2"
toml = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
tiny-skia = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
] }

omnia = "0.35.0"
omnia-guest = "0.35.0"
omnia-testkit = "0.35.0"
omnia-wasi-http = "0.35.0"
omnia-wasi-model = "0.35.0"
wasip3 = { version = "0.7.0", features = ["http-compat"] }
wit-bindgen = { version = "0.58.0", features = ["async-spawn"] }

omnia-cursor = { git = "https://github.com/augentic/backends.git", rev = "a847850658bd7e39b42d80cd21dc1f4d9454b805" }

[patch.crates-io]
omnia = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-guest = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-guest-macros = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-host-macros = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-testkit = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-wasi-config = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-wasi-http = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia.git", rev = "703c4b1006410500d0b68b9a3b254e6a8e4c07f4" }

wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc", rev = "b347c61db52dea9fe515a349ac9a91ba11cfe4f9" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc", rev = "b347c61db52dea9fe515a349ac9a91ba11cfe4f9" }

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
# Groups carry priority = -1 so individual lints below can override them.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The `cargo` group's `multiple_crate_versions` lint is the wrong signal in a
# workspace this size: transitive duplicates accrete from upstream crates we do
# not control (the resvg / usvg / image rasterisation graph), and a ratchet
# allowlist only ever grows. A periodic `cargo tree --duplicates` audit is the
# cheaper signal.
multiple_crate_versions = "allow"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = true
opt-level = 2
strip = true
