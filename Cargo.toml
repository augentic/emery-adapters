[package]
name = "emery-adapters"
description = "The host side of the adapter workspace: the seam and corpus suites over every shipped component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# A tests-and-examples package: `tests/` drives the components
# `crates/test-programs` builds, `examples/` walks each adapter live, and the
# root carries no library or binary of its own.
#
# The example runtime takes its deployment from an `omnia.toml` through
# omnia's `run --config` grammar (`cli`) and dispatches the seam it declares
# (`link`).
[dev-dependencies]
cfg-if.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
documentation.workspace = true
emery-prose.workspace = true
emery-sdk.workspace = true
intent.workspace = true
omnia = { workspace = true, features = ["cli", "link"] }
omnia-cursor.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
serde_json.workspace = true
test-programs.workspace = true
tokio.workspace = true
typescript.workspace = true

# The example guests: wasm32 only, like `crates/test-programs`' programs.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
emery-adapter.workspace = true
omnia-guest.workspace = true
wasip3.workspace = true

[[example]]
name = "documentation"
path = "examples/documentation/guest.rs"
crate-type = ["cdylib"]

[[example]]
name = "intent"
path = "examples/intent/guest.rs"
crate-type = ["cdylib"]

[[example]]
name = "typescript"
path = "examples/typescript/guest.rs"
crate-type = ["cdylib"]

[[example]]
name = "runtime"
path = "examples/runtime.rs"

[lints]
workspace = true

[workspace]
members = ["crates/*", "sources/*"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery-adapters"
rust-version = "1.98"
version = "0.13.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
cfg-if = "1.0.4"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wasip3 = "0.8.0"

omnia = { version = "0.36.0", default-features = false, features = ["jit"] }
omnia-guest = { version = "0.36.0", default-features = false }
omnia-test = { version = "0.36.0", default-features = false }
omnia-wasi-model = "0.36.0"
omnia-wasi-otel = "0.36.0"

omnia-cursor = "0.29.0"

emery-adapter = "0.38.0"
emery-prose = "0.38.0"
emery-sdk = "0.38.0"

# Workspace crates: the fixture pipeline and the shipped adapters' rlibs.
test-programs = { path = "crates/test-programs" }
documentation = { path = "sources/documentation" }
intent = { path = "sources/intent" }
typescript = { path = "sources/typescript" }

[patch.crates-io]
emery-adapter = { git = "https://github.com/augentic/emery" }
emery-prose = { git = "https://github.com/augentic/emery"}
emery-sdk = { git = "https://github.com/augentic/emery"}
# emery-adapter = { path = "../emery/crates/adapter" }
# emery-prose = { path = "../emery/crates/prose" }
# emery-sdk = { path = "../emery/crates/sdk" }

omnia = { git = "https://github.com/augentic/omnia" }
omnia-guest = { git = "https://github.com/augentic/omnia" }
omnia-test = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
# omnia = { path = "../omnia/crates/omnia" }
# omnia-guest = { path = "../omnia/crates/omnia-guest" }
# omnia-test = { path = "../omnia/crates/omnia-test" }
# omnia-wasi-model = { path = "../omnia/crates/wasi-model" }
# omnia-wasi-otel = { path = "../omnia/crates/wasi-otel" }

omnia-cursor = { git = "https://github.com/augentic/omnia-backends" }
# omnia-cursor = { path = "../omnia-backends/crates/cursor" }

wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = { level = "warn", priority = -1 }      # correctness, suspicious, style, complexity, perf
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html

# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Recommended-but-skipped restriction lints with rationale:
# - `tests_outside_test_module`: fires on every integration test in `tests/*.rs`
# - `str_to_string`: opinionated against `.to_string()` on `&str`;
# - `field_scoped_visibility_modifiers`

[profile.release]
lto = true
opt-level = 2
strip = true

# Dependencies keep line tables only (workspace crates are unaffected): the
# seam suites' wasmtime with full debuginfo dominates `target/`.
[profile.dev.package]
"*" = { debug = "line-tables-only" }
