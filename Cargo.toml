[workspace]
members = ["sources/*", "targets/*", "examples/eval"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery-adapters"
rust-version = "1.97"
version = "0.12.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jsonschema = { version = "0.49.9", default-features = false }
resvg = { version = "0.48.1", default-features = false }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.0.1"
serde_json = "1.0.151"
sha2 = "0.11"
tempfile = "3.27.0"
thiserror = "2"
tiny-skia = { version = "0.12.0", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.4"
usvg = { version = "0.48", default-features = false }

omnia-guest = "0.35.0"
omnia-testkit = "0.35.0"

emery-adapter = "0.38.0"
emery-native = "0.38.0"
emery-probe = "0.38.0"
emery-prose = "0.38.0"

captures = { path = "sources/captures" }
contracts = { path = "targets/contracts" }
documentation = { path = "sources/documentation" }
intent = { path = "sources/intent" }
omnia-target = { package = "omnia", path = "targets/omnia" }
screenshots = { path = "sources/screenshots" }
typescript = { path = "sources/typescript" }
vectis = { path = "targets/vectis" }

[patch.crates-io]
emery-adapter = { git = "https://github.com/augentic/emery", branch = "main" }
emery-probe = { git = "https://github.com/augentic/emery", branch = "main" }
emery-native = { git = "https://github.com/augentic/emery", branch = "main" }
emery-prose = { git = "https://github.com/augentic/emery", branch = "main" }
# emery-adapter = { path = "../emery/crates/adapter" }
# emery-probe = { path = "../emery/crates/probe" }
# emery-native = { path = "../emery/crates/native" }
# emery-prose = { path = "../emery/crates/prose" }

omnia = { git = "https://github.com/augentic/omnia" }
omnia-cursor = { git = "https://github.com/augentic/omnia-backends" }
omnia-guest = { git = "https://github.com/augentic/omnia" }
omnia-testkit = { git = "https://github.com/augentic/omnia" }
omnia-wasi-http = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
# omnia = { path = "../omnia/crates/omnia" }
# omnia-cursor = { path = "../omnia-backends/crates/cursor" }
# omnia-guest = { path = "../omnia/crates/omnia-guest" }
# omnia-testkit = { path = "../omnia/crates/testkit" }
# omnia-wasi-http = { path = "../omnia/crates/wasi-http" }
# omnia-wasi-model = { path = "../omnia/crates/wasi-model" }
# omnia-wasi-otel = { path = "../omnia/crates/wasi-otel" }

wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
# Groups carry priority = -1 so individual lints below can override them.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The `cargo` group's `multiple_crate_versions` lint is the wrong signal in a
# workspace this size: transitive duplicates accrete from upstream crates we do
# not control (the resvg / usvg / image rasterisation graph), and a ratchet
# allowlist only ever grows. A periodic `cargo tree --duplicates` audit is the
# cheaper signal.
multiple_crate_versions = "allow"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

[profile.release]
lto = true
opt-level = 2
strip = true
