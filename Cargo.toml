[package]
name = "emery-adapters"
description = "The host side of the adapter workspace: the component and corpus suites over every shipped component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
documentation = { path = "sources/documentation" }
emery-sdk.workspace = true
intent = { path = "sources/intent" }
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
opentelemetry-proto.workspace = true
python = { path = "sources/python" }
serde_json.workspace = true
test-programs.workspace = true
tokio.workspace = true
tracing.workspace = true
typescript = { path = "sources/typescript" }

[lints]
workspace = true

[workspace]
members = ["crates/*", "evals", "sources/*"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery-adapters"
rust-version = "1.99"
version = "0.13.0"
publish = false

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
futures = "0.3.34"
opentelemetry-proto = "0.33.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.1.7"
tracing = "0.1.44"
wasip3 = "0.9.0"

omnia = { version = "0.37.0", default-features = false, features = ["jit"] }
omnia-sdk = { version = "0.37.0", default-features = false }
omnia-test = { version = "0.37.0", default-features = false }
omnia-wasi-model = "0.37.0"
omnia-wasi-otel = "0.37.0"

emery-prose = "0.38.0"
emery-sdk = "0.38.0"
test-programs = { path = "crates/test-programs" }

[patch.crates-io]
emery-prose = { git = "https://github.com/augentic/emery" }
emery-sdk = { git = "https://github.com/augentic/emery" }
# emery-prose = { path = "../emery/crates/prose" }
# emery-sdk = { path = "../emery/crates/sdk" }

omnia = { git = "https://github.com/augentic/omnia" }
omnia-sdk = { git = "https://github.com/augentic/omnia" }
omnia-test = { git = "https://github.com/augentic/omnia" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia" }
# omnia = { path = "../omnia/crates/omnia" }
# omnia-sdk = { path = "../omnia/crates/omnia-sdk" }
# omnia-test = { path = "../omnia/crates/omnia-test" }
# omnia-wasi-model = { path = "../omnia/crates/wasi-model" }
# omnia-wasi-otel = { path = "../omnia/crates/wasi-otel" }

[profile.release]
lto = true
opt-level = 2
strip = true

# Optimise Cranelift debug builds — the unoptimised codegen is ~10x slower.
[profile.dev.package]
"*" = { debug = "line-tables-only" }
documentation = { opt-level = 2 }
intent = { opt-level = 2 }
python = { opt-level = 2 }
test-programs = { opt-level = 2 }
typescript = { opt-level = 2 }

cranelift-assembler-x64 = { opt-level = 2 }
cranelift-bforest = { opt-level = 2 }
cranelift-bitset = { opt-level = 2 }
cranelift-codegen = { opt-level = 2 }
cranelift-control = { opt-level = 2 }
cranelift-entity = { opt-level = 2 }
cranelift-frontend = { opt-level = 2 }
cranelift-native = { opt-level = 2 }
regalloc2 = { opt-level = 2 }
wasmparser = { opt-level = 2 }
wasmtime-environ = { opt-level = 2 }
wasmtime-internal-cranelift = { opt-level = 2 }
