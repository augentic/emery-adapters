[package]
name = "emery-adapters"
description = "The host side of the adapter workspace: the component and corpus suites over every shipped component"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
emery-sdk.workspace = true
omnia.workspace = true
omnia-sdk.workspace = true
omnia-test = { workspace = true, features = ["guest", "host"] }
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
opentelemetry-proto.workspace = true
serde_json.workspace = true
emery-documentation = { path = "adapters/documentation" }
emery-intent = { path = "adapters/intent" }
emery-python = { path = "adapters/python" }
emery-typescript = { path = "adapters/typescript" }
emery-node = { path = "adapters/node" }
emery-omnia = { path = "adapters/omnia" }
omnia-template.workspace = true
syn.workspace = true
test-programs.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[workspace]
members = ["adapters/*", "crates/*", "evals"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/emery-adapters"
rust-version = "1.100"
version = "0.12.0"
publish = false

[workspace.lints.rust]
meta_variable_misuse = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# cherry-picked `restriction`s
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
map_err_ignore = "warn"
print_stderr = "warn"
print_stdout = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
futures = "0.3.34"
opentelemetry-proto = "0.33.1"
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syn = { version = "3.0.9", default-features = false, features = ["extra-traits", "full", "parsing", "visit"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
wasip3 = "0.10.0"

test-programs = { path = "crates/test-programs" }

emery-sdk = "0.39.0"

omnia = { version = "0.38.0", default-features = false, features = ["jit"] }
omnia-sdk = { version = "0.38.0", default-features = false }
# Held with the omnia revision under `[patch.crates-io]`.
omnia-template = { git = "https://github.com/augentic/omnia-exemplar", rev = "6f3c0ec5c2da87aa58bf2153ac9079a702aa1e86" }
omnia-test = { version = "0.38.0", default-features = false }
omnia-wasi-model = "0.38.0"
omnia-wasi-otel = "0.38.0"

# omnia is held at the last commit before its WIT and SDK migration (omnia
# #403), which the engine and the adapters have not been moved to. It moves
# with `omnia-template` above and with the engine's own pin.
[patch.crates-io]
emery-prose = { git = "https://github.com/augentic/emery", branch = "build-change" }
emery-sdk = { git = "https://github.com/augentic/emery", branch = "build-change" }
omnia = { git = "https://github.com/augentic/omnia", rev = "a96c4075dad1382055d46af245d64cea9ab5cb9f" }
omnia-sdk = { git = "https://github.com/augentic/omnia", rev = "a96c4075dad1382055d46af245d64cea9ab5cb9f" }
omnia-test = { git = "https://github.com/augentic/omnia", rev = "a96c4075dad1382055d46af245d64cea9ab5cb9f" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia", rev = "a96c4075dad1382055d46af245d64cea9ab5cb9f" }
omnia-wasi-otel = { git = "https://github.com/augentic/omnia", rev = "a96c4075dad1382055d46af245d64cea9ab5cb9f" }

[profile.release]
lto = true
opt-level = 2
strip = true

# Optimise Cranelift debug builds — the unoptimised codegen is ~10x slower.
[profile.dev.package]
"*" = { debug = "line-tables-only" }
emery-documentation = { opt-level = 2 }
emery-intent = { opt-level = 2 }
emery-python = { opt-level = 2 }
emery-typescript = { opt-level = 2 }
emery-node = { opt-level = 2 }
emery-omnia = { opt-level = 2 }
test-programs = { opt-level = 2 }

cranelift-assembler-x64 = { opt-level = 2 }
cranelift-bforest = { opt-level = 2 }
cranelift-bitset = { opt-level = 2 }
cranelift-codegen = { opt-level = 2 }
cranelift-control = { opt-level = 2 }
cranelift-entity = { opt-level = 2 }
cranelift-frontend = { opt-level = 2 }
cranelift-native = { opt-level = 2 }
regalloc2 = { opt-level = 2 }
wasmparser = { opt-level = 2 }
wasmtime-environ = { opt-level = 2 }
wasmtime-internal-cranelift = { opt-level = 2 }
