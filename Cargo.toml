[workspace]
resolver = "3"
members = [
    "crates/*",
    "sources/*/crates/*",
    "sources/captures",
    "sources/documentation",
    "sources/intent",
    "sources/screenshots",
    "sources/typescript",
    "targets/*/crates/*",
    "targets/*/extension",
    "targets/contracts",
    "targets/omnia",
    "tools/rust-quality",
]

# The Specify adapters repo (RFC-48 / RFC-49 T6). Each RFC-61 adapter root
# (`{sources,targets}/<name>/`) *is* its guest package — a wasm32-only
# `specify-<name>` cdylib shim at the adapter root over a wasm-free
# `crates/core/` crate (`specify-<name>-core`) — so the package physically
# contains the briefs/references it embeds. Shared guest support lives under
# top-level `crates/`. Guest roots are explicit members (prose-only adapters
# have no root package, so a bare `targets/*` glob cannot work); the crate
# trees glob. The legacy WASI extension crate stays at `<adapter>/extension/`
# — `specify adapter build` and CORE-061 pin that path — until RFC-61 Step 5
# deletes it.

[workspace.package]
authors = ["Augentic"]
edition = "2024"
homepage = "https://augentic.io"
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/specify-adapters"
rust-version = "1.95"
version = "0.4.3"
publish = false

[workspace.dependencies]
anyhow = "1"
cfg-if = "1"
clap = { version = "4", features = ["derive", "env"] }
jsonschema = { version = "0.46", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.26"
serde_json = "1"
sha2 = "0.11"
specify-guest-kit = { path = "crates/guest-kit" }
specify-prose-registry = { path = "crates/prose-registry" }
specify-contracts-core = { path = "targets/contracts/crates/core" }
thiserror = "2"
toml = "1"
assert_cmd = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
tiny-skia = { version = "0.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Omnia guest SDK — the 0.35.0 crates are unpublished pre-publish pins,
# supplied from the same git rev the specify engine pins (see
# [patch.crates-io] below).
omnia = "0.35.0"
omnia-guest = "0.35.0"
omnia-testkit = "0.35.0"
omnia-wasi-http = "0.35.0"
omnia-wasi-model = "0.35.0"
wasip3 = { version = "0.7.0", features = ["http-compat"] }
wit-bindgen = { version = "0.58.0", features = ["async-spawn"] }

# Spawned cursor-agent model backend (unpublished; supplied straight from
# the augentic/backends repo). Pinned to the pushed main head; a follow-up
# bump picks up the in-flight cursor output-parser fix once it lands.
omnia-cursor = { git = "https://github.com/augentic/backends.git", rev = "573087bb8ae87bef1354e33c271d5a73d600fb63" }

[patch.crates-io]
# Same unpublished-pin rev as augentic/specify's engine workspace; drop
# when omnia publishes to crates.io.
omnia = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-guest = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-guest-macros = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-host-macros = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-testkit = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-wasi-config = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-wasi-http = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }
omnia-wasi-model = { git = "https://github.com/augentic/omnia.git", rev = "63c24f0367dd6f8ffaa319f74f5bd2f3fa6d222b" }

# `wrpc-wasmtime` 0.1.0 is unpublished on crates.io; omnia's own
# [patch.crates-io] supplies it, but patches do not propagate to
# dependents, so this workspace carries the same patch pinned to the rev
# omnia's Cargo.lock records.
wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc", rev = "b347c61db52dea9fe515a349ac9a91ba11cfe4f9" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc", rev = "b347c61db52dea9fe515a349ac9a91ba11cfe4f9" }

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
# Groups carry priority = -1 so individual lints below can override them.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The `cargo` group's `multiple_crate_versions` lint is the wrong signal in a
# workspace this size: transitive duplicates accrete from upstream crates we do
# not control (the resvg / usvg / image rasterisation graph), and a ratchet
# allowlist only ever grows. A periodic `cargo tree --duplicates` audit is the
# cheaper signal.
multiple_crate_versions = "allow"

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
mixed_read_write_in_expression = "warn"
mod_module_files = "warn"
non_zero_suggestions = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
semicolon_outside_block = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"

# Recommended-but-skipped restriction lints with rationale:
# - `tests_outside_test_module`: fires on every integration test in `tests/*.rs`
#   (by construction, integration tests are top-level fns in their own crate
#   and cannot be inside `#[cfg(test)] mod tests`).
# - `str_to_string` / `string_to_string`: opinionated against `.to_string()` on
#   `&str`; `string_to_string` was also removed from clippy in 1.95 in favour of
#   `clippy::implicit_clone`.
# - `field_scoped_visibility_modifiers`: the workspace deliberately uses
#   `pub(crate)` / `pub(super)` on struct fields throughout.

[profile.release]
lto = true
opt-level = 2
strip = true
