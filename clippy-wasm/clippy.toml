# Guest-only deny-list, applied via CLIPPY_CONF_DIR on the
# `--target wasm32-wasip2` clippy leg only (canonical copy:
# https://github.com/augentic/lints README). This file replaces any root
# clippy config for that invocation.

disallowed-methods = [
  { path = "std::env::var", reason = "adapters receive configuration through the source seam" },
  { path = "std::env::vars", reason = "adapters receive configuration through the source seam" },
  { path = "std::env::var_os", reason = "adapters receive configuration through the source seam" },
  { path = "std::time::SystemTime::now", reason = "wall-clock time is a host capability" },
  { path = "std::time::Instant::now", reason = "monotonic time is a host capability" },
]

disallowed-types = [
  { path = "std::sync::OnceLock", reason = "global state does not survive the instance-per-request model" },
  { path = "std::sync::LazyLock", reason = "global state does not survive the instance-per-request model" },
]
